<style>
  :root {
    --bg: #05060f;
    --ink: #e9ecff;
    --dim: #8b93c4;
    --accent: #46e0ff;
    --accent-2: #ff5d8f;
    --gold: #ffe14d;
    --panel: rgba(14, 18, 40, 0.72);
    --stroke: rgba(120, 160, 255, 0.18);
    --font: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  /* phones: no double-tap zoom delay, no unexpected text inflation */
  button, .btn, .icon-btn, .dpad button, input { touch-action: manipulation; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    overscroll-behavior: none;
    width: 100%;
  }

  /* A tap-to-play game should never scroll or pinch by accident. */
  body { position: fixed; inset: 0; }
  @supports (height: 100dvh) { body { position: static; inset: auto; height: 100dvh; } }

  body {
    display: flex;
    justify-content: center;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(70, 224, 255, 0.10), transparent 60%),
      radial-gradient(900px 600px at 100% 110%, rgba(255, 93, 143, 0.10), transparent 60%),
      var(--bg);
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 780px;
    /* older browsers do not know dvh, so give them vh first */
    min-height: 100vh;
    min-height: 100dvh;
    /* keep clear of notches, rounded corners and home bars */
    padding: calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
             calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  }

  /* ---------------- HUD ---------------- */
  .hud {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border: 1px solid var(--stroke);
    border-radius: 16px;
    background: var(--panel);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 62px;
  }
  .stat b {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums;
  }
  .stat span {
    font-size: 9px;
    letter-spacing: 1.6px;
    color: var(--dim);
    text-transform: uppercase;
  }
  #score { color: var(--gold); text-shadow: 0 0 12px rgba(255, 225, 77, 0.45); }
  #high { color: var(--accent); text-shadow: 0 0 12px rgba(70, 224, 255, 0.35); }

  .spacer { flex: 1; }

  #lives { display: flex; gap: 4px; align-items: center; height: 17px; }
  #lives i {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: conic-gradient(from 20deg, var(--gold) 0 300deg, transparent 300deg 360deg);
    box-shadow: 0 0 8px rgba(255, 225, 77, 0.5);
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    border: 1px solid var(--stroke);
    background: rgba(255, 255, 255, 0.04);
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn:hover { background: rgba(70, 224, 255, 0.14); border-color: rgba(70, 224, 255, 0.4); }
  .icon-btn:active { transform: scale(0.93); }

  /* ---------------- Stage ---------------- */
  #stage {
    position: relative;
    flex: 1;
    width: 100%;
    display: grid;
    place-items: center;
    min-height: 0;
    touch-action: none;
  }

  canvas {
    display: block;
    border-radius: 18px;
    background: #04050c;
    box-shadow:
      0 0 0 1px rgba(120, 160, 255, 0.14),
      0 24px 60px rgba(0, 0, 0, 0.6),
      0 0 90px rgba(70, 224, 255, 0.08);
    image-rendering: auto;
  }

  /* ---------------- Overlay ---------------- */
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    place-items: center;
    padding: 14px;
    border-radius: 18px;
    background: radial-gradient(600px 400px at 50% 30%, rgba(10, 14, 34, 0.72), rgba(4, 5, 12, 0.88));
    backdrop-filter: blur(7px);
    animation: fade 0.22s ease;
    overflow: auto;
  }
  .overlay.show { display: flex; align-items: center; justify-content: center; }
  .card { margin: auto; }   /* keeps the top reachable when the card overflows */
  .overlay::-webkit-scrollbar { width: 6px; }
  .overlay::-webkit-scrollbar-thumb { background: rgba(150, 180, 255, 0.25); border-radius: 3px; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .card {
    width: min(420px, 100%);
    text-align: center;
    padding: 22px 20px;
    border: 1px solid var(--stroke);
    border-radius: 20px;
    background: linear-gradient(180deg, rgba(22, 28, 58, 0.9), rgba(10, 13, 28, 0.92));
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    animation: pop 0.24s cubic-bezier(0.2, 1.3, 0.5, 1);
  }
  @keyframes pop { from { transform: scale(0.94) translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }

  .card h1 {
    margin: 0 0 4px;
    font-size: clamp(28px, 7vw, 40px);
    letter-spacing: 2px;
    font-weight: 900;
    line-height: 1;
    background: linear-gradient(92deg, var(--gold), var(--accent-2) 55%, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 93, 143, 0.35));
  }
  .card .tagline {
    margin: 0 0 16px;
    font-size: 12.5px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--dim);
  }
  .card h2 { margin: 0 0 6px; font-size: 25px; letter-spacing: 1.5px; }
  .card p { margin: 0 0 16px; font-size: 13.5px; line-height: 1.55; color: #c3c9ee; }
  .card p b { color: var(--gold); }

  .roster {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 7px;
    margin: 0 0 16px;
  }
  .roster span {
    font-size: 10.5px;
    letter-spacing: 0.9px;
    padding: 5px 9px;
    border-radius: 999px;
    border: 1px solid var(--stroke);
    background: rgba(255, 255, 255, 0.04);
    white-space: nowrap;
  }
  .roster i {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 5px;
    border-radius: 50%;
    vertical-align: middle;
  }

  .keys { display: flex; flex-direction: column; gap: 6px; margin: 0 0 16px; font-size: 12px; color: var(--dim); }
  .keys div { display: flex; gap: 8px; align-items: center; justify-content: center; }
  kbd {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 7px;
    border: 1px solid rgba(150, 180, 255, 0.3);
    border-bottom-width: 2px;

  }

  .actions { display: flex; flex-direction: column; gap: 9px; align-items: center; }

  .btn {
    appearance: none;
    border: 0;
    cursor: pointer;
    padding: 13px 30px;
    border-radius: 13px;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #08111f;
    background: linear-gradient(180deg, #7ff0ff, #35c6ee 60%, #1aa5d6);
    box-shadow: 0 8px 26px rgba(53, 198, 238, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    transition: transform 0.12s ease, filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.07); }
  .btn:active { transform: translateY(1px) scale(0.985); }
  .btn.ghost {
    background: rgba(255, 255, 255, 0.06);
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--stroke);

  .final { display: flex; gap: 22px; justify-content: center; margin: 4px 0 18px; }
  .final div { display: flex; flex-direction: column; gap: 2px; }
  .final strong { font-size: 24px; font-variant-numeric: tabular-nums; }
  .final small { font-size: 9.5px; letter-spacing: 1.4px; color: var(--dim); text-transform: uppercase; }

  /* ---------------- Touch controls ---------------- */
  .dpad {
    position: absolute;
    bottom: calc(8px + env(safe-area-inset-bottom));
    right: calc(8px + env(safe-area-inset-right));
    display: grid;
    grid-template-columns: repeat(3, min(52px, 13vw));
    grid-template-rows: repeat(3, min(52px, 13vw));
    gap: 6px;
    opacity: 0.85;
    z-index: 3;
  }
  .dpad[hidden] { display: none; }
  .dpad button {
    border: 1px solid var(--stroke);
    border-radius: 14px;

  }
  .dpad button:active { background: rgba(70, 224, 255, 0.28); }
  .dpad .u { grid-area: 1 / 2; }
  .dpad .l { grid-area: 2 / 1; }
  .dpad .r { grid-area: 2 / 3; }
  .dpad .d { grid-area: 3 / 2; }

  /* ---------------- Online: scoreboard chips ---------------- */
  .badge {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    letter-spacing: 0.8px;
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid var(--stroke);

  .badge b { color: var(--ink); letter-spacing: 1.4px; }
  .badge em { font-style: normal; opacity: 0.75; }
  .badge.ok { border-color: rgba(90, 240, 180, 0.4); color: #8ef7c0; }
  .badge.ok b { color: #b6ffe0; }
  .badge.warn { border-color: rgba(255, 170, 90, 0.45); color: #ffc98a; }

  .scores {
    width: 100%;
    display: flex;

  .scores .chip.me { border-color: rgba(255, 225, 77, 0.5); box-shadow: 0 0 14px rgba(255, 225, 77, 0.14); }
  .scores .chip.out { opacity: 0.45; text-decoration: line-through; }
  .scores .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .scores .chip b { font-weight: 700; letter-spacing: 0.3px; }
  .scores .chip em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--gold); }
  .scores .chip u { text-decoration: none; color: var(--accent); font-size: 10px; }
  .scores .chip s { text-decoration: none; color: var(--gold); }

  /* ---------------- Online: forms, lobby, standings ---------------- */
  .card.wide { width: min(480px, 100%); }
  .card .note {
    font-size: 12px;
    color: #c3c9ee;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--stroke);
    border-radius: 10px;
    padding: 8px 10px;
    margin: 0 0 12px;
  }
  .card .note.warn { color: #ffd7a1; border-color: rgba(255, 180, 90, 0.35); }
  .card .status { font-size: 11px; color: var(--dim); letter-spacing: 0.6px; margin: 0 0 12px; }

  .field { display: block; text-align: left; margin: 0 0 12px; }
  .field span {
    display: block;
    font-size: 9.5px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 4px;
  }
  .field input, .joinrow input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 11px;
    border: 1px solid rgba(150, 180, 255, 0.25);
    background: rgba(6, 9, 22, 0.75);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    letter-spacing: 0.6px;
    outline: none;
  }
  .field input:focus, .joinrow input:focus { border-color: rgba(70, 224, 255, 0.6); }
  .field small { display: block; font-size: 10.5px; color: var(--dim); margin-top: 5px; line-height: 1.5; }
  .field code { font-size: 10.5px; color: #bfe9ff; }

  .joinrow { display: flex; gap: 8px; width: 100%; }
  .joinrow input { text-align: center; text-transform: uppercase; letter-spacing: 6px; font-weight: 800; font-size: 18px; }
  .btn.small { padding: 12px 18px; font-size: 13px; }
  .btn.alt {
    background: rgba(255, 255, 255, 0.06);
    color: var(--ink);
    box-shadow: inset 0 0 0 1px var(--stroke);
    font-size: 12.5px;
    padding: 11px 22px;
  }
  .btn.tiny { padding: 7px 12px; font-size: 10.5px; }

  .codebox {
    border: 1px dashed rgba(150, 180, 255, 0.35);
    border-radius: 14px;
    padding: 12px;
    margin: 0 0 14px;
  }
  .codebox span { display: block; font-size: 9px; letter-spacing: 2px; color: var(--dim); }
  .codebox b {
    display: block;
    font-size: 32px;
    letter-spacing: 8px;

    text-shadow: 0 0 20px rgba(70, 224, 255, 0.5);

  .codebox .link {
    font-size: 10px;
    color: var(--dim);
    word-break: break-all;
    margin: 8px 0 0;

  .lobbylist { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .lobbylist li {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 11px;
    border: 1px solid var(--stroke);

  }
  .lobbylist i { width: 10px; height: 10px; border-radius: 50%; }
  .lobbylist b { flex: 1; text-align: left; font-weight: 700; }
  .lobbylist em { font-style: normal; font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .lobbylist u { text-decoration: none; font-size: 9.5px; letter-spacing: 1.2px; color: var(--gold); }

  .scoreboard { margin: 0 0 18px; }
  .scoreboard h3 {
    margin: 0 0 4px;
    font-size: 15px;
    letter-spacing: 1.6px;

  }
  .scoreboard .note { background: none; border: 0; padding: 0; color: var(--dim); font-size: 11px; }
  .scoreboard ol { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .scoreboard li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 11px;
    border-radius: 11px;
    border: 1px solid var(--stroke);
    background: rgba(255, 255, 255, 0.03);
    font-size: 13px;
  }
  .scoreboard li.me { border-color: rgba(255, 225, 77, 0.45); background: rgba(255, 225, 77, 0.06); }
  .scoreboard li.out { opacity: 0.55; }
  .scoreboard .medal { width: 18px; font-size: 13px; }
  .scoreboard li i { width: 10px; height: 10px; border-radius: 50%; }
  .scoreboard li b { flex: 1; text-align: left; font-weight: 700; }
  .scoreboard li em { font-style: normal; font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 800; }
  .scoreboard li u { text-decoration: none; font-size: 10px; color: var(--dim); min-width: 66px; text-align: right; }

  .hint {
    font-size: 11px;
    letter-spacing: 0.6px;
    color: #6b73a3;
    text-align: center;
    min-height: 14px;
  }
  .hint kbd { font-size: 10px; padding: 2px 5px; }
  .hint .touch { display: none; }
  @media (pointer: coarse) {
    .hint .desktop { display: none; }
    .hint .touch { display: inline; }
  }
</style>

<body>
<div id="app">
  <header class="hud">
    <div class="stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Best</span><b id="high">0</b></div>
    <div class="stat"><span>Level</span><b id="level">1</b></div>
    <div class="spacer"></div>
    <div class="stat" style="min-width:0"><span>Lives</span><div id="lives"></div></div>
    <div id="net-badge" class="badge" hidden></div>
    <button class="icon-btn" id="btn-sound" title="Sound on/off (M)" aria-label="Toggle sound">🔊</button>
    <button class="icon-btn" id="btn-pause" title="Pause (P)" aria-label="Pause">❚❚</button>
  </header>

  <div id="scores" class="scores" hidden></div>

  <main id="stage">
    <canvas id="game" width="672" height="744" aria-label="Neon Chase game board"></canvas>
    <div id="overlay" class="overlay"></div>
    <div id="dpad" class="dpad" hidden>
      <button class="u" data-dir="up" aria-label="Up">▲</button>
      <button class="l" data-dir="left" aria-label="Left">◀</button>
      <button class="r" data-dir="right" aria-label="Right">▶</button>
      <button class="d" data-dir="down" aria-label="Down">▼</button>
    </div>
  </main>

  <footer class="hint">
    <span class="desktop">Move with <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · <kbd>P</kbd> pause · <kbd>M</kbd> mute</span>
    <span class="touch">Swipe anywhere to move · pad for fine control · <b>❚❚</b> for the menu</span>
  </footer>
</div>
<script>
/* =====================================================================
   NEON CHASE — network session
   ---------------------------------------------------------------------
   Transport and protocol only; the game lives in game.js.

   The server (server.js) is a dumb room relay: it hands out room codes,
   tracks who is in the room, and forwards opaque `relay` messages
   between peers. All game authority sits with the host's browser, which
   means no game logic has to be duplicated server-side.

   Wire protocol (client -> server):
     { t: 'hello',  name, v: 1 }      identify yourself
     { t: 'create' }                  open a room, become host
     { t: 'join',   code }            join an existing room
     { t: 'relay',  data }            forward `data` to everyone else
     { t: 'leave' }                   leave the room (socket may stay up)

   Server -> client:
     { t: 'welcome', id, name }       you are connected
     { t: 'room',    code, host, peers }   you are in a room (host: you?)
     { t: 'peers',   peers }          room membership changed
     { t: 'relay',   from, data }     someone else's message
     { t: 'error',   why, msg }       no-room / full / bad-version / ...
     { t: 'ended',   why }            the room is gone (host left)
   ===================================================================== */
(function () {
  'use strict';

  const VERSION = 1;

  /* Injected for tests: (url) => WebSocket-like object */
  let wsFactory = null;
  function useWebSocket(fn) { wsFactory = fn; }

  function defaultSocket(url) {
    const WS = typeof WebSocket !== 'undefined' ? WebSocket : null;
    if (!WS) throw new Error('WebSockets are not available in this browser');
    return new WS(url);
  }

  /** Where should the online game connect to? */
  function defaultUrl() {
    try {
      if (typeof location !== 'undefined' && location.protocol && /^https?:$/.test(location.protocol)) {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        return `${proto}//${location.host}`;
      }
      // Opened straight from disk (file://) — remember whichever server the
      // player used last, they can type a new one in the lobby.
      const saved = localStorage.getItem('neonchase.server');
      return saved || '';
    } catch (err) {
      return '';
    }
  }

  function saveUrl(url) {
    try {
      if (url) localStorage.setItem('neonchase.server', url);
      else localStorage.removeItem('neonchase.server');
    } catch (err) { /* private mode, whatever */ }
  }

  const CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no I/O/0/1
  function randomName() {
    const n = 1 + Math.floor(Math.random() * 98);
    return 'Disc ' + n;
  }

  /**
   * Open a session. Events arrive through `onEvent`:
   *   { type: 'open' }                          socket connected
   *   { type: 'welcome', id, name }
   *   { type: 'room', code, host, peers, self }  in a room (host: am I host?)
   *   { type: 'peers', peers }
   *   { type: 'data', from, data }              a peer's game message
   *   { type: 'ping', ms }                      round-trip time to the server
   *   { type: 'error', why, msg }
   *   { type: 'ended', why }
   *   { type: 'closed', code }
   */
  function createSession(opts) {
    const onEvent = opts.onEvent || function () {};
    const name = opts.name || randomName();
    let url = opts.url || defaultUrl();
    let ws = null;
    let selfId = null;
    let role = 'idle';          // idle | host | guest
    let rooms = { code: null, peers: [], host: false };
    let pingTimer = null;
    let pingSentAt = 0;
    let closed = false;

    function emit(ev) { try { onEvent(ev); } catch (err) { console.error(err); } }

    function send(obj) {
      if (!ws || ws.readyState !== 1) return false;
      try { ws.send(JSON.stringify(obj)); return true; } catch (err) { return false; }
    }

    function startPing() {
      stopPing();
      pingTimer = setInterval(() => {
        if (!ws || ws.readyState !== 1) return;
        pingSentAt = Date.now();
        send({ t: 'relay', data: { t: '_ping' } });
      }, 2000);
    }
    function stopPing() { if (pingTimer) { clearInterval(pingTimer); pingTimer = null; } }

    function open(newUrl) {
      if (newUrl) url = newUrl;
      if (!url) { emit({ type: 'error', why: 'no-server' }); return false; }
      saveUrl(url);
      closed = false;
      try {
        const socket = (wsFactory || defaultSocket)(url);
        ws = socket;
      } catch (err) {
        emit({ type: 'error', why: 'nosocket', msg: String(err && err.message || err) });
        return false;
      }

      ws.onopen = () => {
        send({ t: 'hello', name, v: VERSION });
        startPing();
        emit({ type: 'open' });
      };
      ws.onmessage = (ev) => {
        let m;
        try { m = JSON.parse(typeof ev.data === 'string' ? ev.data : String(ev.data)); } catch (err) { return; }
        handle(m);
      };
      ws.onclose = () => {
        stopPing();
        role = 'idle';
        rooms = { code: null, peers: [], host: false };
        if (!closed) emit({ type: 'closed' });
      };
      ws.onerror = () => {
        emit({ type: 'error', why: 'connect' });
      };
      return true;
    }

    function handle(m) {
      switch (m.t) {
        case 'welcome':
          selfId = m.id;
          emit({ type: 'welcome', id: m.id, name: m.name });
          break;
        case 'room':
          role = m.host ? 'host' : 'guest';
          rooms = { code: m.code, peers: m.peers || [], host: !!m.host };
          emit({ type: 'room', code: m.code, host: !!m.host, peers: rooms.peers, self: selfId });
          break;
        case 'peers':
          rooms.peers = m.peers || [];
          emit({ type: 'peers', peers: rooms.peers });
          break;
        case 'relay':
          if (m.data && m.data.t === '_ping') {
            send({ t: 'relay', data: { t: '_pong' } });
            return;
          }
          if (m.data && m.data.t === '_pong') {
            emit({ type: 'ping', ms: Date.now() - pingSentAt });
            return;
          }
          emit({ type: 'data', from: m.from, data: m.data });
          break;
        case 'error':
          emit({ type: 'error', why: m.why, msg: m.msg });
          break;
        case 'ended':
          role = 'idle';
          rooms = { code: null, peers: [], host: false };
          emit({ type: 'ended', why: m.why });
          break;
        default:
          break;
      }
    }

    return {
      get role() { return role; },
      get url() { return url; },
      get selfId() { return selfId; },
      get peers() { return rooms.peers; },
      get code() { return rooms.code; },
      get connected() { return !!ws && ws.readyState === 1; },
      get name() { return name; },
      setUrl(u) { url = u; saveUrl(u); },
      open,
      host() { return send({ t: 'create' }); },
      join(code) { return send({ t: 'join', code: String(code || '').toUpperCase().trim() }); },
      send,
      leave() {
        stopPing();
        send({ t: 'leave' });
        if (ws) { try { ws.close(); } catch (err) { /* ignore */ } }
        ws = null;
        role = 'idle';
        rooms = { code: null, peers: [], host: false };
      },
      /** Tell the other players why the session ended and shut down. */
      shutdown() {
        closed = true;
        this.leave();
      },
    };
  }

  /** Build a shareable link to a room (works with any host URL). */
  function inviteLink(code) {
    try {
      if (typeof location === 'undefined' || !location.href) return '?room=' + code;
      const u = new URL(location.href);
      u.searchParams.set('room', code);
      u.hash = '';
      return u.toString();
    } catch (err) {
      return '?room=' + code;
    }
  }

  function roomFromUrl() {
    try {
      const q = new URLSearchParams(typeof location !== 'undefined' ? location.search : '');
      const code = q.get('room');
      return code ? code.toUpperCase().trim() : null;
    } catch (err) {
      return null;
    }
  }

  window.NeonNet = {
    VERSION,
    createSession,
    defaultUrl,
    saveUrl,
    useWebSocket,
    randomName,
    inviteLink,
    roomFromUrl,
    CODE_ALPHABET,
  };
})();

<script>
/* =====================================================================
   NEON CHASE — a maze chase arcade game
   ---------------------------------------------------------------------
   Plain browser script (no build step, no dependencies).
   You are the glowing disc. Four hunters want you. Eat every dot in the
   maze to clear the level. Power orbs make the hunters edible for a few
   seconds — that is when the chased becomes the chaser.

   Legend of the maze strings:
     #  wall            .  dot              o  power orb
     -  ghost door      (space) empty floor
   ===================================================================== */
(function () {
  'use strict';

  /* ==================================================================
     1. THE MAZE
     ================================================================== */
  const MAZE = [
    '############################',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#o####.#####.##.#####.####o#',
    '#.####.#####.##.#####.####.#',
    '#..........................#',
    '#.####.##.########.##.####.#',
    '#.####.##.########.##.####.#',
    '#......##....##....##......#',
    '######.##### ## #####.######',
    '######.##### ## #####.######',
    '######.##          ##.######',
    '######.## ###--### ##.######',
    '######.## #      # ##.######',
    '      .   #      #   .      ',
    '######.## #      # ##.######',
    '######.## ######## ##.######',
    '######.##          ##.######',
    '######.## ######## ##.######',
    '######.## ######## ##.######',
    '#............##............#',
    '#.####.#####.##.#####.####.#',
    '#.####.#####.##.#####.####.#',
    '#o..##.......  .......##..o#',
    '###.##.##.########.##.##.###',
    '###.##.##.########.##.##.###',
    '#......##....##....##......#',
    '#.##########.##.##########.#',
    '#.##########.##.##########.#',
    '#..........................#',
    '############################',
  ];

  const COLS = MAZE[0].length;
  const ROWS = MAZE.length;
  const TILE = 24;
  const W = COLS * TILE;
  const H = ROWS * TILE;

  const OPEN = 0, WALL = 1, DOOR = 2;
  const NO_DOT = 0, DOT = 1, ORB = 2;

  // Tile bookkeeping
  const idx = (x, y) => y * COLS + x;
  const tiles = new Uint8Array(COLS * ROWS);
  const baseDots = new Uint8Array(COLS * ROWS);
  const dots = new Uint8Array(COLS * ROWS);
  let totalDots = 0;

  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      const ch = MAZE[y][x];
      tiles[idx(x, y)] = ch === '#' ? WALL : ch === '-' ? DOOR : OPEN;
      const d = ch === '.' ? DOT : ch === 'o' ? ORB : NO_DOT;
      baseDots[idx(x, y)] = d;
      if (d) totalDots++;
    }
  }

  const wrapX = (x) => (x < 0 ? COLS - 1 : x >= COLS ? 0 : x);

  /* Every random draw goes through here, so a test can seed the whole game. */
  const defaultRng = Math.random;
  let rand = defaultRng;
  const setRng = (fn) => { rand = typeof fn === 'function' ? fn : defaultRng; };

  function tileType(x, y) {
    if (y < 0 || y >= ROWS) return WALL; // above/below the maze is solid
    return tiles[idx(wrapX(x), y)];
  }

  /** Can something stand on this tile? `allowDoor` lets hunters use the pen door. */
  function canWalk(x, y, allowDoor) {
    const t = tileType(x, y);
    if (t === WALL) return false;
    if (t === DOOR) return !!allowDoor;
    return true;
  }

  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const DIR_LIST = ['up', 'left', 'down', 'right'];
  const OPP = { up: 'down', down: 'up', left: 'right', right: 'left' };

  /* The pen (hunter house) and key tiles around it */
  const PEN = {
    door: { x: 13, y: 12 },
    exit: { x: 13, y: 11 },
    inside: { x: 13, y: 14 },
    left: 11,
    right: 15,
  };
  const PLAYER_START = { x: 13, y: 23 };
  const BONUS_TILE = { x: 13, y: 17 };

  /* Where up to four discs park before a race, and what colour each one is. */
  const SPAWNS = [
    { x: 13, y: 23 }, { x: 14, y: 23 }, { x: 12, y: 23 }, { x: 15, y: 23 },
  ];
  const PLAYER_COLORS = ['#ffe14d', '#7cf6a0', '#ff9de0', '#8fd0ff'];
  const MAX_PLAYERS = 4;

  /* ==================================================================
     2. TUNING
     ================================================================== */
  const SPEED = {
    // The disc keeps a real edge over the hunters — about 20% at level 1,
    // narrowing to almost nothing deep into the game.
    player: 7.7, playerStep: 0.14, playerMax: 9.6,
    hunter: 6.1, hunterStep: 0.26, hunterMax: 8.9,
    fright: 4.1, frightStep: 0.1, frightMin: 3.4,
    eyes: 13,
    pen: 4.6,
    tunnel: 0.55,
  };

  const MODE_PLAN = [
    ['scatter', 7], ['chase', 20],
    ['scatter', 7], ['chase', 20],
    ['scatter', 5], ['chase', 20],
    ['scatter', 5], ['chase', Infinity],
  ];

  const HUNTERS = [
    { name: 'Blinky', color: '#ff4b57', glow: 'rgba(255,75,87,0.75)', corner: { x: COLS - 2, y: 0 }, start: { x: PEN.exit.x, y: PEN.exit.y }, inside: false, release: 0, note: 'hunts you head-on' },
    { name: 'Pinky', color: '#ff8ad8', glow: 'rgba(255,138,216,0.7)', corner: { x: 1, y: 0 }, start: { x: PEN.inside.x, y: PEN.inside.y }, inside: true, release: 3, note: 'cuts you off' },
    { name: 'Inky', color: '#54d6ff', glow: 'rgba(84,214,255,0.7)', corner: { x: COLS - 2, y: ROWS - 1 }, start: { x: PEN.left, y: PEN.inside.y }, inside: true, release: 8, note: 'flanks from behind' },
    { name: 'Clyde', color: '#ffb347', glow: 'rgba(255,179,71,0.7)', corner: { x: 1, y: ROWS - 1 }, start: { x: PEN.right, y: PEN.inside.y }, inside: true, release: 14, note: 'wanders, then pounces' },
  ];

  /* ==================================================================
     3. GAME STATE
     ================================================================== */
  const game = {
    state: 'title',        // title | ready | playing | dying | levelclear | gameover | paused
    prevState: 'playing',
    time: 0,
    stateTimer: 0,
    deathT: 0,
    high: 0,
    level: 1,
    dotsLeft: totalDots,
    dotsEaten: 0,
    combo: 0,
    frightTimer: 0,
    frightTotal: 0,
    mode: 'scatter',
    modeIndex: 0,
    modeTimer: MODE_PLAN[0][1],
    bonus: null,
    bonusGiven: 0,
    shake: 0,
    flash: 0,
    manual: false,
    players: [],
    localIndex: 0,
    ghosts: [],
    particles: [],
    floats: [],
    frame: 0,
    /* multiplayer */
    mode2: 'solo',         // solo | host | guest
    net: null,             // the NeonNet session, when online
    netStatus: 'offline',  // offline | connecting | lobby | live | lost
    netPing: 0,
    netName: '',
    roomCode: null,
    race: false,           // more than one disc on the board
    lastSnapAt: 0,
    startedAt: 0,
  };

  /** The disc this client steers. In solo it is the only one. */
  const local = () => game.players[game.localIndex] || game.players[0] || { score: 0, lives: 0 };

  // Solo code (and the tests) read game.score / game.lives as the local
  // player's numbers; keep that working now that every player keeps its own.
  Object.defineProperty(game, 'score', {
    get: () => local().score,
    set: (v) => { local().score = v; },
    enumerable: true,
  });
  Object.defineProperty(game, 'lives', {
    get: () => local().lives,
    set: (v) => { local().lives = v; },
    enumerable: true,
  });
  Object.defineProperty(game, 'wantDir', {
    get: () => (local().wantDir || 'left'),
    set: (v) => { local().wantDir = v; },
    enumerable: true,
  });
  Object.defineProperty(game, 'player', {
    // the old single-player name for "the disc you steer"
    get: () => local(),
    enumerable: false,
  });

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const dpad = document.getElementById('dpad');
  const ui = {
    score: document.getElementById('score'),
    high: document.getElementById('high'),
    level: document.getElementById('level'),
    lives: document.getElementById('lives'),
    scores: document.getElementById('scores'),
    net: document.getElementById('net-badge'),
    sound: document.getElementById('btn-sound'),
    pause: document.getElementById('btn-pause'),
  };

  let mazeLayer = null;   // pre-rendered walls (device pixels)
  let scaleDpr = 1;       // device pixels per logical pixel

  /* ==================================================================
     4. SOUND (tiny WebAudio synth)
     ================================================================== */
  const Sound = (() => {
    let ac = null, master = null;
    let enabled = true;
    let unlocked = false;
    let lastWaka = 0, wakaHigh = false, lastFright = 0;

    /**
     * Mobile browsers (iOS especially) only let audio start inside a user
     * gesture, and our sounds fire from the animation loop. So we open the
     * context on the first tap or key press and keep it alive from there.
     */
    function unlock() {
      if (unlocked) return;
      unlocked = true;
      const a = node();
      if (!a) return;
      const kick = () => {
        if (ac.state === 'suspended' && ac.resume) ac.resume().catch(() => {});
      };
      kick();
      // a silent blip also wakes iOS up properly
      try {
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        gain.gain.value = 0.0001;
        osc.connect(gain);
        gain.connect(master);
        osc.start();
        osc.stop(ac.currentTime + 0.02);
      } catch (err) { /* ignore */ }
    }

    function node() {
      if (!enabled) return null;
      try {
        if (!ac) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ac = new AC();
          master = ac.createGain();
          master.gain.value = 0.45;
          master.connect(ac.destination);
        }
        if (ac.state === 'suspended' && ac.resume) ac.resume();
        return ac;
      } catch (err) {
        return null;
      }
    }

    function tone(freq, dur, type, vol, slideTo, delay) {
      const a = node();
      if (!a) return;
      try {
        const t0 = a.currentTime + (delay || 0);
        const osc = a.createOscillator();
        const gain = a.createGain();
        osc.type = type || 'square';
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.001, vol == null ? 0.22 : vol), t0 + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain);
        gain.connect(master);
        osc.start(t0);
        osc.stop(t0 + dur + 0.04);
      } catch (err) { /* audio is a nicety, never fatal */ }
    }

    return {
      get enabled() { return enabled; },
      setEnabled(v) {
        enabled = !!v;
        if (master) master.gain.value = enabled ? 0.45 : 0;
        if (enabled) node();
      },
      unlock,
      waka() {
        const t = game.time;
        if (t - lastWaka < 0.055) return;
        lastWaka = t;
        wakaHigh = !wakaHigh;
        tone(wakaHigh ? 208 : 152, 0.06, 'square', 0.17);
      },
      power() {
        tone(320, 0.09, 'square', 0.2, 700);
        tone(500, 0.14, 'square', 0.18, 980, 0.08);
      },
      eatHunter(combo) {
        const base = 340 + combo * 90;
        tone(base, 0.09, 'square', 0.22);
        tone(base * 1.5, 0.11, 'square', 0.2, null, 0.07);
      },
      fright() {
        const t = game.time;
        if (t - lastFright < 0.34) return;
        lastFright = t;
        tone(game.frightTimer % 0.7 > 0.35 ? 190 : 150, 0.1, 'sawtooth', 0.09);
      },
      death() {
        tone(520, 0.5, 'square', 0.24, 90);
        tone(300, 0.7, 'triangle', 0.18, 60, 0.22);
      },
      levelUp() {
        [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'square', 0.2, null, i * 0.11));
      },
      extraLife() {
        [784, 988, 1319].forEach((f, i) => tone(f, 0.14, 'triangle', 0.22, null, i * 0.1));
      },
      gameOver() {
        [440, 349, 262, 196].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.18, null, i * 0.16));
      },
      pen() { tone(120, 0.08, 'triangle', 0.1); },
    };
  })();

  /* ==================================================================
     5. ENTITIES & MOVEMENT
     Every mover sits on a tile and slides toward the next tile in its
     direction: `p` runs 0 → 1 across that tile. No float drift, so the
     grid is always exact.
     ================================================================== */
  function moverPos(m) {
    const [dx, dy] = DIRS[m.dir];
    return { x: (m.tx + 0.5 + dx * m.p) * TILE, y: (m.ty + 0.5 + dy * m.p) * TILE };
  }

  function stepMover(m, distance, onArrive) {
    let left = distance;
    let guard = 0;
    while (left > 1e-6 && guard++ < 48) {
      const need = (1 - m.p) * TILE;
      if (left < need) {
        m.p += left / TILE;
        break;
      }
      left -= need;
      const [dx, dy] = DIRS[m.dir];
      m.tx = wrapX(m.tx + dx);
      m.ty += dy;
      m.p = 0;
      if (onArrive(m) === false) return; // blocked: stay put
    }
  }

  /** Flip direction mid-tile (allowed for everyone). */
  function reverseMover(m) {
    if (m.p > 0) {
      const [dx, dy] = DIRS[m.dir];
      m.tx = wrapX(m.tx + dx);
      m.ty += dy;
      m.p = 1 - m.p;
    }
    m.dir = OPP[m.dir];
  }

  function makePlayer(index, opts) {
    const o = opts || {};
    const spawn = o.spawn || SPAWNS[index % SPAWNS.length];
    return {
      id: o.id || 'local',
      name: o.name || 'You',
      color: o.color || PLAYER_COLORS[index % PLAYER_COLORS.length],
      tx: spawn.x, ty: spawn.y, dir: 'left', p: 0,
      anim: 0, moving: true, isPlayer: true,
      isLocal: !!o.isLocal,
      score: 0, lives: 3, extraLife: false,
      out: false, dead: false, respawnT: 0, invuln: 0,
      wantDir: 'left',
      /* guest-side smoothing of the host's snapshots */
      rx: null, ry: null, netDir: 'left',
    };
  }

  /* Which disc is this object? (used by the net layer and the renderer) */
  const playerById = (id) => game.players.find((p) => p.id === id) || null;

  function makeHunter(def) {
    return {
      def, name: def.name, color: def.color, glow: def.glow,
      tx: def.start.x, ty: def.start.y, dir: 'left', p: 0,
      state: def.inside ? 'pen' : 'roam',
      releaseTimer: def.release,
      frightened: false, pendingReverse: false,
      bounce: rand() * Math.PI * 2, anim: 0,
    };
  }

  function playerSpeed() {
    return Math.min(SPEED.playerMax, SPEED.player + (game.level - 1) * SPEED.playerStep);
  }
  function hunterSpeed() {
    return Math.min(SPEED.hunterMax, SPEED.hunter + (game.level - 1) * SPEED.hunterStep);
  }
  function frightSpeed() {
    return Math.max(SPEED.frightMin, SPEED.fright - (game.level - 1) * SPEED.frightStep);
  }
  function frightDuration() {
    return Math.max(2.4, 8.2 - (game.level - 1) * 0.6);
  }
  const allowDoor = (h) => h.state === 'pen' || h.state === 'leaving' || h.state === 'dead' || h.state === 'entering';
  const inTunnel = (x, y) => y === 14 && (x < 6 || x > COLS - 7);

  /* ==================================================================
     6. UPDATE — the player
     ================================================================== */
  function updatePlayer(P, dt, canEat) {
    const want = P.wantDir;

    // Instant turns: reversal works mid-tile, side turns work whenever the
    // disc is parked exactly on a tile centre (or when it is blocked).
    if (want && want !== P.dir) {
      const [wx, wy] = DIRS[want];
      const open = canWalk(P.tx + wx, P.ty + wy);
      if (want === OPP[P.dir] && P.p > 0) {
        reverseMover(P);
      } else if (P.p === 0 && open) {
        P.dir = want;
      }
    }

    const before = P.tx + P.ty + P.p;
    stepMover(P, playerSpeed() * TILE * dt, (m) => {
      // Guests only predict movement; the host owns pellets and points.
      if (canEat !== false) eatAt(m.tx, m.ty, P);
      const w = P.wantDir;
      if (w && canWalk(m.tx + DIRS[w][0], m.ty + DIRS[w][1])) {
        m.dir = w;
      } else {
        const [dx, dy] = DIRS[m.dir];
        if (!canWalk(m.tx + dx, m.ty + dy)) return false; // wall ahead: park here
      }
      return true;
    });
    const travelled = Math.abs(P.tx + P.ty + P.p - before);
    P.moving = travelled > 1e-6;
    if (P.moving) P.anim += dt;
  }

  /** Move every disc on the board. Dead and finished discs stay put. */
  function updatePlayers(dt) {
    for (const P of game.players) {
      if (P.out || P.dead) continue;
      updatePlayer(P, dt);
    }
  }

  /* ==================================================================
     7. UPDATE — the hunters
     ================================================================== */
  /** Who is closest to this hunter? (dead discs do not count) */
  function nearestPlayer(from) {
    let best = null;
    let bestD = Infinity;
    for (const P of game.players) {
      if (P.out || P.dead) continue;
      const d = Math.hypot(P.tx - from.tx, P.ty - from.ty);
      if (d < bestD) { bestD = d; best = P; }
    }
    return best || game.players[0] || null;
  }

  function anyPlayerAlive() {
    return game.players.some((p) => !p.out);
  }

  function hunterTarget(h) {
    const P = nearestPlayer(h) || game.players[0];
    if (!P) return h.def.corner;
    const [pdx, pdy] = DIRS[P.dir];
    switch (h.name) {
      case 'Blinky':
        return { x: P.tx, y: P.ty };
      case 'Pinky':
        return { x: P.tx + pdx * 4, y: P.ty + pdy * 4 };
      case 'Inky': {
        const b = game.ghosts[0];
        const ax = P.tx + pdx * 2, ay = P.ty + pdy * 2;
        return { x: ax * 2 - b.tx, y: ay * 2 - b.ty };
      }
      default: {
        const far = Math.hypot(P.tx - h.tx, P.ty - h.ty) > 8;
        return far ? { x: P.tx, y: P.ty } : h.def.corner;
      }
    }
  }

  function pickDir(h, target) {
    const allow = allowDoor(h);
    const options = [];
    for (const d of DIR_LIST) {
      if (d === OPP[h.dir]) continue;
      if (!canWalk(h.tx + DIRS[d][0], h.ty + DIRS[d][1], allow)) continue;
      options.push(d);
    }
    if (!options.length) return OPP[h.dir];

    // Scared hunters stumble around at random.
    if (h.frightened && h.state === 'roam') {
      return options[(rand() * options.length) | 0];
    }

    let best = options[0];
    let bestD = Infinity;
    for (const d of options) {
      const nx = h.tx + DIRS[d][0];
      const ny = h.ty + DIRS[d][1];
      const dx = nx - target.x, dy = ny - target.y;
      const dist = dx * dx + dy * dy;
      if (dist < bestD - 1e-9) { bestD = dist; best = d; }
    }
    return best;
  }

  function hunterDecide(h) {
    if (h.state === 'leaving') {
      if (h.tx !== PEN.door.x) h.dir = PEN.door.x > h.tx ? 'right' : 'left';
      else if (h.ty > PEN.exit.y) h.dir = 'up';
      else { h.state = 'roam'; h.dir = pickDir(h, hunterTarget(h)); }
      return;
    }
    if (h.state === 'entering') {
      if (h.ty < PEN.inside.y) h.dir = 'down';
      else {
        h.state = 'pen';
        h.releaseTimer = Math.max(0.6, 2.6 - game.level * 0.15);
        h.bounce = 0;
        h.frightened = false;
      }
      return;
    }
    if (h.state === 'dead') {
      if (h.tx === PEN.exit.x && h.ty === PEN.exit.y) {
        h.state = 'entering';
        h.dir = 'down';
        return;
      }
      h.dir = pickDir(h, PEN.exit);
      return;
    }
    h.dir = pickDir(h, h.frightened ? h.def.corner : (game.mode === 'scatter' ? h.def.corner : hunterTarget(h)));
  }

  function updateHunter(h, dt) {
    if (h.state === 'pen') {
      h.bounce += dt * 5.5;
      h.releaseTimer -= dt;
      if (h.releaseTimer <= 0) {
        h.state = 'leaving';
        h.p = 0;
      }
      return;
    }

    if (h.pendingReverse) {
      h.pendingReverse = false;
      if (h.state === 'roam') reverseMover(h);
    }

    let speed;
    if (h.state === 'dead') speed = SPEED.eyes;
    else if (h.state === 'leaving' || h.state === 'entering') speed = SPEED.pen;
    else if (h.frightened) speed = frightSpeed();
    else speed = hunterSpeed();

    if (h.state === 'roam' && inTunnel(h.tx, h.ty)) speed *= SPEED.tunnel;

    h.anim += dt;
    stepMover(h, speed * TILE * dt, (m) => {
      hunterDecide(m);
      return true;
    });
  }

  /* ==================================================================
     8. RULES: eating, catching, levels
     ================================================================== */
  /** Points go to the disc that earned them. */
  function addScore(n, who) {
    const P = who || local();
    const before = P.score;
    P.score += n;
    if (!P.extraLife && before < 10000 && P.score >= 10000) {
      P.extraLife = true;
      P.lives++;
      if (P.isLocal) Sound.extraLife();
      if (P.isLocal) floatText(W / 2, 8 * TILE, 'EXTRA LIFE!', '#8ef7a0', 22);
    }
    if (P.isLocal && P.score > game.high) {
      game.high = P.score;
      saveHigh();
    }
    if (P.isLocal) paintHud();
    if (game.mode2 === 'host') netSend({ t: 'score', id: P.id, s: P.score, lives: P.lives });
  }

  function eatAt(x, y, who) {
    const P = who || local();
    const i = idx(x, y);
    if (dots[i] === DOT) {
      dots[i] = NO_DOT;
      game.dotsLeft--;
      game.dotsEaten++;
      addScore(10, P);
      if (P.isLocal) Sound.waka();
      if (game.dotsEaten % 7 === 0) sparkle((x + 0.5) * TILE, (y + 0.5) * TILE, '#ffd9a0', 3);
      maybeBonus();
    } else if (dots[i] === ORB) {
      dots[i] = NO_DOT;
      game.dotsLeft--;
      game.dotsEaten++;
      addScore(50, P);
      if (P.isLocal) Sound.power();
      startFright();
      burst((x + 0.5) * TILE, (y + 0.5) * TILE, '#bff3ff', 22);
      game.flash = 0.35;
      game.shake = 0.35;
      maybeBonus();
    }

    if (game.bonus && game.bonus.x === x && game.bonus.y === y) {
      addScore(game.bonus.value, P);
      floatText((x + 0.5) * TILE, (y + 0.5) * TILE, '+' + game.bonus.value, '#ffe14d', 20);
      burst((x + 0.5) * TILE, (y + 0.5) * TILE, '#ffe14d', 20);
      if (P.isLocal) Sound.eatHunter(1);
      game.bonus = null;
    }

    if (game.dotsLeft <= 0 && game.state === 'playing') clearLevel();
  }

  function maybeBonus() {
    if (game.bonusGiven === 0 && game.dotsEaten >= 70) spawnBonus();
    else if (game.bonusGiven === 1 && game.dotsEaten >= 170) spawnBonus();
  }

  function spawnBonus() {
    game.bonusGiven++;
    game.bonus = { x: BONUS_TILE.x, y: BONUS_TILE.y, life: 9.5, value: 100 * Math.min(5, game.level), spin: 0 };
  }

  function startFright() {
    game.frightTimer = frightDuration();
    game.frightTotal = game.frightTimer;
    game.combo = 0;
    for (const h of game.ghosts) {
      if (h.state === 'dead' || h.state === 'entering') continue;
      h.frightened = true;
      h.pendingReverse = true;
    }
  }

  function endFright() {
    game.frightTimer = 0;
    game.combo = 0;
    for (const h of game.ghosts) h.frightened = false;
  }

  function eatHunter(h, who) {
    const P = who || local();
    const value = 200 * Math.pow(2, game.combo);
    game.combo = Math.min(game.combo + 1, 3);
    h.frightened = false;
    h.state = 'dead';
    h.p = 0;
    const pos = moverPos(h);
    addScore(value, P);
    floatText(pos.x, pos.y, String(value), '#8ef0ff', 21);
    burst(pos.x, pos.y, h.color, 26);
    game.shake = 0.3;
    if (P.isLocal) Sound.eatHunter(game.combo);
    if (game.mode2 === 'host') netSend({ t: 'fx', kind: 'eatHunter', x: pos.x, y: pos.y, v: value, name: P.name });
  }

  function catchPlayer(P) {
    if (game.state !== 'playing' || P.out || P.dead || P.invuln > 0) return;
    P.lives--;
    const pos = moverPos(P);
    burst(pos.x, pos.y, P.color, 30);
    if (P.isLocal) {
      game.shake = 0.8;
      Sound.death();
      paintHud();
    } else if (game.mode2 === 'host') {
      netSend({ t: 'fx', kind: 'caught', x: pos.x, y: pos.y, id: P.id, name: P.name });
    }

    if (!game.race && game.players.length === 1) {
      // Solo keeps the classic beat: the board freezes for the death jingle
      // and afterDeath() decides between respawn and game over.
      game.state = 'dying';
      game.deathT = 0;
      game.frightTimer = 0;
      game.combo = 0;
      for (const h of game.ghosts) h.frightened = false;
      return;
    }

    // A race cannot pause for one disc: it puffs out and comes back — unless
    // that was its last life, in which case it spectates.
    if (P.lives <= 0) {
      P.out = true;
      P.dead = false;
      if (P.isLocal) paintHud();
      if (!anyPlayerAlive()) endRound('all-out');
    } else {
      P.dead = true;
      P.respawnT = 2.2;
      P.p = 0;
    }
  }

  function checkCatch() {
    for (const P of game.players) {
      if (P.out || P.dead || P.invuln > 0) continue;
      const pp = moverPos(P);
      for (const h of game.ghosts) {
        if (h.state === 'dead' || h.state === 'entering' || h.state === 'pen') continue;
        const hp = moverPos(h);
        if (Math.hypot(hp.x - pp.x, hp.y - pp.y) < TILE * 0.62) {
          if (h.frightened) eatHunter(h, P);
          else { catchPlayer(P); }
          break;
        }
      }
      if (game.state !== 'playing') return;
    }
  }

  function clearLevel() {
    game.state = 'levelclear';
    game.stateTimer = game.race ? 3.6 : 2.6;
    game.flash = 0.5;
    addScore(250 + 50 * game.level, local());
    if (game.mode2 !== 'guest') Sound.levelUp();
    if (game.race) showScreen('standings');
  }

  /** The race is over: everyone is out, or the board is clear and we stop. */
  function endRound(why) {
    game.state = 'gameover';
    game.roundWhy = why;
    if (game.mode2 === 'host') netSend({ t: 'over', why: why });
    Sound.gameOver();
    showScreen('standings');
  }

  function afterDeath() {
    if (game.lives <= 0) {
      game.state = 'gameover';
      if (game.players[0]) game.players[0].out = true;
      Sound.gameOver();
      showScreen('gameover');
      return;
    }
    // Keep the disc (and its score): only the positions are reset.
    resetActors(true);
    game.state = 'ready';
    game.stateTimer = 1.9;
  }

  /* ==================================================================
     9. MODE TIMER (scatter ⇄ chase) + per-frame systems
     ================================================================== */
  /** Bring dead racers back after their puff of smoke. */
  function updateRespawns(dt) {
    for (const P of game.players) {
      if (!P.dead) continue;
      P.respawnT -= dt;
      if (P.respawnT > 0) continue;
      const spawn = SPAWNS[game.players.indexOf(P) % SPAWNS.length];
      P.dead = false;
      P.tx = spawn.x;
      P.ty = spawn.y;
      P.p = 0;
      P.dir = 'left';
      P.invuln = 1.4;
      P.rx = null;
      P.ry = null;
    }
  }

  function updateMode(dt) {
    if (game.frightTimer > 0) return; // the clock pauses while everyone is scared
    game.modeTimer -= dt;
    if (game.modeTimer > 0) return;

    game.modeIndex = Math.min(game.modeIndex + 1, MODE_PLAN.length - 1);
    const [mode, base] = MODE_PLAN[game.modeIndex];
    const scaled = mode === 'scatter' ? Math.max(2.5, base * (1 - (game.level - 1) * 0.09)) : base;
    game.mode = mode;
    game.modeTimer = scaled;
    for (const h of game.ghosts) if (h.state === 'roam') h.pendingReverse = true;
  }

  function updateBonus(dt) {
    if (!game.bonus) return;
    game.bonus.life -= dt;
    game.bonus.spin += dt * 2.4;
    if (game.bonus.life <= 0) game.bonus = null;
  }

  function updateParticles(dt) {
    for (let i = game.particles.length - 1; i >= 0; i--) {
      const q = game.particles[i];
      q.life -= dt;
      q.x += q.vx * dt;
      q.y += q.vy * dt;
      q.vx *= 1 - 2.4 * dt;
      q.vy *= 1 - 2.4 * dt;
      if (q.life <= 0) game.particles.splice(i, 1);
    }
    for (let i = game.floats.length - 1; i >= 0; i--) {
      const f = game.floats[i];
      f.life -= dt;
      f.y -= 26 * dt;
      if (f.life <= 0) game.floats.splice(i, 1);
    }
    if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 1.9);
    if (game.flash > 0) game.flash = Math.max(0, game.flash - dt * 1.6);
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2;
      const s = 60 + rand() * 190;
      game.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: 0.35 + rand() * 0.5, max: 0.85,
        size: 1.6 + rand() * 2.6, color,
      });
    }
  }

  function sparkle(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2;
      game.particles.push({
        x, y, vx: Math.cos(a) * 40, vy: Math.sin(a) * 40 - 20,
        life: 0.25, max: 0.25, size: 1.5, color,
      });
    }
  }

  function floatText(x, y, text, color, size) {
    game.floats.push({ x, y, text, color, size: size || 18, life: 1.1, max: 1.1 });
  }

  /* ==================================================================
     10. MAIN UPDATE
     ================================================================== */
  function update(dt) {
    game.time += dt;
    game.frame++;
    for (const P of game.players) if (P.invuln > 0) P.invuln -= dt;

    switch (game.state) {
      case 'ready':
        game.stateTimer -= dt;
        for (const h of game.ghosts) if (h.state === 'pen') h.bounce += dt * 5.5;
        if (game.stateTimer <= 0) game.state = 'playing';
        break;

      case 'playing':
        if (isGuest()) {
          updateGuest(dt);
          break;
        }
        if (game.race && !anyPlayerAlive()) { endRound('all-out'); break; }
        updateMode(dt);
        if (game.frightTimer > 0) {
          game.frightTimer -= dt;
          if (local().isLocal || game.mode2 !== 'guest') Sound.fright();
          if (game.frightTimer <= 0) endFright();
        }
        updatePlayers(dt);
        for (const h of game.ghosts) updateHunter(h, dt);
        checkCatch();
        updateBonus(dt);
        updateRespawns(dt);
        break;

      case 'dying':
        game.deathT += dt;
        for (const h of game.ghosts) h.anim += dt;
        if (game.deathT >= 1.9) afterDeath();
        break;

      case 'levelclear':
        game.stateTimer -= dt;
        for (const h of game.ghosts) h.anim += dt;
        if (game.stateTimer <= 0) {
          game.level++;
          newLevel();
        }
        break;

      default:
        for (const h of game.ghosts) if (h.state === 'pen') h.bounce += dt * 5.5;
        break;
    }

    updateParticles(dt);

    if (isHost()) {
      const changed = game.state !== game.lastState;
      game.lastState = game.state;
      broadcastSnapshot(changed);
    }
  }

  /** A guest does not simulate: it predicts its own disc and smooths the rest. */
  function updateGuest(dt) {
    const P = local();
    if (P && P.isLocal && !P.dead && !P.out) updatePlayer(P, dt, false);
    updateNetSmoothing(dt);
  }

  /* ==================================================================
     11. RENDERING
     ================================================================== */
  // Each level re-lights the maze with a different neon hue.
  const THEME_HUES = [206, 172, 266, 322, 34, 138];
  function theme() {
    const hue = THEME_HUES[(game.level - 1) % THEME_HUES.length];
    return {
      inset: `hsl(${hue} 62% 13%)`,
      deep: `hsl(${hue} 70% 7%)`,
      edge: `hsl(${hue} 96% 68%)`,
      dot: '#ffd8a8',
      orb: '#fff3c9',
    };
  }

  function buildMazeLayer() {
    const c = document.createElement('canvas');
    c.width = canvas.width;
    c.height = canvas.height;
    const lc = c.getContext('2d');
    lc.setTransform(scaleDpr, 0, 0, scaleDpr, 0, 0);

    const th = theme();

    lc.fillStyle = '#04050c';
    lc.fillRect(0, 0, W, H);

    // Wall blocks: merged rectangles of dark ink
    const grad = lc.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, th.inset);
    grad.addColorStop(1, th.deep);
    lc.fillStyle = grad;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (tiles[idx(x, y)] !== WALL) continue;
        lc.fillRect(x * TILE, y * TILE, TILE, TILE);
      }
    }

    // Outline pass — one line per wall/floor boundary. Off-grid counts as
    // floor so the outer border gets its neon rim.
    const line = document.createElement('canvas');
    line.width = c.width;
    line.height = c.height;
    const oc = line.getContext('2d');
    oc.setTransform(scaleDpr, 0, 0, scaleDpr, 0, 0);
    oc.strokeStyle = th.edge;
    oc.lineWidth = 2.3;
    oc.lineCap = 'round';
    oc.beginPath();
    const inset = 1.5;
    const isWallForOutline = (x, y) => (y < 0 || y >= ROWS || x < 0 || x >= COLS) ? false : tiles[idx(x, y)] === WALL;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (tiles[idx(x, y)] !== WALL) continue;
        const px = x * TILE, py = y * TILE;
        if (!isWallForOutline(x, y - 1)) { oc.moveTo(px, py + inset); oc.lineTo(px + TILE, py + inset); }
        if (!isWallForOutline(x, y + 1)) { oc.moveTo(px, py + TILE - inset); oc.lineTo(px + TILE, py + TILE - inset); }
        if (!isWallForOutline(x - 1, y)) { oc.moveTo(px + inset, py); oc.lineTo(px + inset, py + TILE); }
        if (!isWallForOutline(x + 1, y)) { oc.moveTo(px + TILE - inset, py); oc.lineTo(px + TILE - inset, py + TILE); }
      }
    }
    oc.stroke();

    // Neon bloom: blurred copies of the outline, then the crisp line on top.
    let canBlur = false;
    try {
      lc.filter = 'blur(7px)';
      canBlur = typeof lc.filter === 'string' && lc.filter !== 'none';
    } catch (err) { canBlur = false; }
    if (canBlur) {
      lc.save();
      lc.globalCompositeOperation = 'lighter';
      lc.globalAlpha = 0.85;
      lc.drawImage(line, 0, 0, W, H);
      lc.globalAlpha = 0.55;
      lc.drawImage(line, 0, 0, W, H);
      lc.filter = 'none';
      lc.restore();
    }
    lc.drawImage(line, 0, 0, W, H);

    // Pen door: a soft bar across the two door tiles
    lc.strokeStyle = 'rgba(255,180,255,0.55)';
    lc.lineWidth = 3;
    lc.lineCap = 'round';
    lc.beginPath();
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (tiles[idx(x, y)] !== DOOR) continue;
        lc.moveTo(x * TILE + 3, y * TILE + TILE / 2);
        lc.lineTo(x * TILE + TILE - 3, y * TILE + TILE / 2);
      }
    }
    lc.stroke();

    // Soft inner vignette so the middle of the board reads as a stage.
    const vg = lc.createRadialGradient(W / 2, H / 2, TILE * 4, W / 2, H / 2, H * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    lc.fillStyle = vg;
    lc.fillRect(0, 0, W, H);

    mazeLayer = c;
  }

  function drawDots(time) {
    // dots in one batch
    ctx.beginPath();
    const pulse = 0.5 + 0.5 * Math.sin(time * 4);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        const d = dots[idx(x, y)];
        if (d !== DOT) continue;
        const cx = (x + 0.5) * TILE, cy = (y + 0.5) * TILE;
        ctx.moveTo(cx + 2.3, cy);
        ctx.arc(cx, cy, 2.3, 0, Math.PI * 2);
      }
    }
    ctx.fillStyle = theme().dot;
    ctx.fill();

    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (dots[idx(x, y)] !== ORB) continue;
        const cx = (x + 0.5) * TILE, cy = (y + 0.5) * TILE;
        const r = 4.2 + pulse * 1.4;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = theme().orb;
        ctx.shadowColor = 'rgba(255,243,201,0.9)';
        ctx.shadowBlur = 16;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
  }

  function drawBonus() {
    const b = game.bonus;
    if (!b) return;
    if (b.life < 3 && Math.floor(b.life * 6) % 2 === 0) return; // blink out
    const x = (b.x + 0.5) * TILE, y = (b.y + 0.5) * TILE;
    const r = TILE * 0.42;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(b.spin) * 0.3);
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.lineTo(r * 0.8, 0);
    ctx.lineTo(0, r);
    ctx.lineTo(-r * 0.8, 0);
    ctx.closePath();
    ctx.fillStyle = '#ffe14d';
    ctx.shadowColor = 'rgba(255,225,77,0.95)';
    ctx.shadowBlur = 22;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.restore();
  }

  /** Where this entity should be drawn right now. */
  function drawPos(e, time) {
    if (e.rx != null && e.ry != null) return { x: e.rx, y: e.ry };
    void time;
    return moverPos(e);
  }

  function drawPlayer(P, time) {
    if (P.out) return;
    const isLocal = P.isLocal;
    const pos = drawPos(P, time);
    const r = TILE * 0.46;
    const dir = P.rx != null ? (P.netDir || P.dir) : P.dir;
    const [dx, dy] = DIRS[dir] || [0, 0];
    const angle = Math.atan2(dy, dx);
    const colour = P.color || '#ffe14d';

    let half; // mouth half-angle in radians
    let alpha = 1;
    const dyingSolo = isLocal && game.state === 'dying';
    if (dyingSolo) {
      const k = Math.min(1, game.deathT / 1.35);
      half = k * Math.PI;
      alpha = 1 - Math.max(0, (game.deathT - 1.35) / 0.4);
      if (alpha <= 0) return;
    } else if (P.dead) {
      // puffed out on the spot, about to respawn
      const k = Math.min(1, 1 - P.respawnT / 2.2);
      half = k * Math.PI * 0.5;
      alpha = 0.85;
    } else if (game.state === 'ready' && isLocal) {
      half = 0.22;
    } else if (!P.moving && P.rx == null) {
      half = 0.22;
    } else {
      half = 0.05 + Math.abs(Math.sin(P.anim * 9)) * 0.38;
    }

    ctx.save();
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.translate(pos.x, pos.y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, half, Math.PI * 2 - half);
    ctx.closePath();
    ctx.fillStyle = colour;
    ctx.shadowColor = colour;
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;
    // inner shine
    ctx.beginPath();
    ctx.arc(-r * 0.15, -r * 0.3, r * 0.28, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();
    ctx.restore();

    // name tags for the other discs in a race
    if (game.race && !isLocal) {
      const label = String(P.name || '').slice(0, 10);
      const tagX = Math.max(24, Math.min(W - 24, pos.x));
      const tagY = Math.max(12, pos.y - TILE * 0.6);
      ctx.save();
      ctx.font = '700 10px ui-rounded, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(4,5,12,0.85)';
      ctx.strokeText(label, tagX, tagY);
      ctx.fillStyle = colour;
      ctx.globalAlpha = 0.95;
      ctx.fillText(label, tagX, tagY);
      ctx.restore();
    }
  }

  function drawGhostShape(x, y, r, time, wobble) {
    const bottom = y + r * 0.92;
    const seg = (r * 2) / 3;
    ctx.beginPath();
    ctx.arc(x, y - r * 0.12, r, Math.PI, 0);
    ctx.lineTo(x + r, bottom);
    let cx = x + r;
    for (let i = 0; i < 3; i++) {
      const nx = cx - seg;
      const up = (i % 2 === 0 ? 1 : -1) + Math.sin(time * 9 + wobble) * 0.25;
      ctx.quadraticCurveTo((cx + nx) / 2, bottom + up * r * 0.3, nx, bottom);
      cx = nx;
    }
    ctx.closePath();
  }

  function drawHunter(h, time) {
    let pos;
    if (h.rx != null && h.ry != null) {
      // a guest renders the host's positions, smoothed
      pos = { x: h.rx, y: h.ry };
      if (h.state === 'pen') pos.y += Math.sin(h.bounce) * 4;
    } else if (h.state === 'pen') {
      pos = { x: (h.tx + 0.5) * TILE, y: (h.ty + 0.5) * TILE + Math.sin(h.bounce) * 4 };
    } else {
      pos = moverPos(h);
    }
    const r = TILE * 0.44;
    const [dx, dy] = DIRS[h.dir];
    const dead = h.state === 'dead';
    const flashing = h.frightened && game.frightTimer > 0 && game.frightTimer < 2.2 && Math.floor(game.frightTimer * 7) % 2 === 0;

    if (!dead) {
      ctx.save();
      let body = h.color;
      let glow = h.glow;
      if (h.frightened) {
        body = flashing ? '#ffffff' : '#3f57ff';
        glow = flashing ? 'rgba(255,255,255,0.8)' : 'rgba(63,87,255,0.8)';
      }
      ctx.shadowColor = glow;
      ctx.shadowBlur = 18;
      ctx.fillStyle = body;
      drawGhostShape(pos.x, pos.y, r, time, h.bounce);
      ctx.fill();
      ctx.shadowBlur = 0;

      // dome highlight
      ctx.beginPath();
      ctx.arc(pos.x - r * 0.3, pos.y - r * 0.45, r * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fill();
      ctx.restore();
    }

    // eyes (they always show, and they are all that is left when eaten)
    const eyeDX = r * 0.36, eyeY = pos.y - r * 0.16, eyeR = r * 0.3;
    const dirOff = dead ? 0 : r * 0.13;
    for (const side of [-1, 1]) {
      const ex = pos.x + side * eyeDX;
      ctx.beginPath();
      ctx.arc(ex, eyeY, eyeR, 0, Math.PI * 2);
      ctx.fillStyle = '#fdfdff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex + dx * dirOff, eyeY + dy * dirOff, eyeR * 0.5, 0, Math.PI * 2);
      ctx.fillStyle = h.frightened && !dead ? (flashing ? '#dd3355' : '#1b2a8f') : '#1b1b3a';
      ctx.fill();
    }

    if (h.frightened && !dead) {
      // wavy scared mouth
      ctx.beginPath();
      const my = pos.y + r * 0.36;
      const mw = r * 0.5;
      ctx.moveTo(pos.x - mw, my);
      for (let i = 0; i < 4; i++) {
        const nx = pos.x - mw + ((i + 1) * (mw * 2)) / 4;
        ctx.lineTo(nx, my + (i % 2 === 0 ? -3 : 3));
      }
      ctx.strokeStyle = flashing ? '#cc2244' : '#dff0ff';
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const q of game.particles) {
      const a = Math.max(0, q.life / q.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = q.color;
      ctx.beginPath();
      ctx.arc(q.x, q.y, q.size * (0.4 + a * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloats() {
    for (const f of game.floats) {
      const a = Math.max(0, Math.min(1, f.life / f.max));
      ctx.globalAlpha = a;
      ctx.font = `800 ${f.size}px ui-rounded, system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      ctx.fillText(f.text, f.x, f.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  function bigText(text, color, y, size) {
    ctx.save();
    ctx.font = `900 ${size || 30}px ui-rounded, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 22;
    ctx.fillText(text, W / 2, y);
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  function render() {
    const time = game.time;
    ctx.setTransform(scaleDpr, 0, 0, scaleDpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#04050c';
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (game.shake > 0) {
      const s = game.shake * 9;
      ctx.translate((rand() - 0.5) * s, (rand() - 0.5) * s);
    }

    if (mazeLayer) ctx.drawImage(mazeLayer, 0, 0, W, H);
    drawDots(time);
    drawBonus();

    const hideActors = game.state === 'title' || game.state === 'gameover';
    if (!hideActors) {
      for (const h of game.ghosts) drawHunter(h, time);
      for (const P of game.players) drawPlayer(P, time);
    }
    drawParticles();
    drawFloats();

    if (game.frightTimer > 0) {
      ctx.fillStyle = 'rgba(48,74,220,0.12)';
      ctx.fillRect(0, 0, W, H);
    }
    if (game.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${game.flash * 0.28})`;
      ctx.fillRect(0, 0, W, H);
    }

    if (game.state === 'ready') {
      bigText(game.stateTimer > 1.2 || Math.floor(game.stateTimer * 8) % 2 === 0 ? 'READY!' : '', '#ffe14d', 20.6 * TILE, 30);
    } else if (game.state === 'levelclear') {
      const on = Math.floor(time * 8) % 2 === 0;
      if (on) bigText('LEVEL CLEAR', '#8ef7a0', 20.6 * TILE, 28);
    }

    ctx.restore();
  }

  /* ==================================================================
     12. FLOW: title → ready → playing → …
     ================================================================== */
  /** Rebuild the discs for a fresh round, keeping names/colours/online ids. */
  function resetActors(preservePlayers) {
    const keep = preservePlayers ? game.players : null;
    if (keep && keep.length) {
      keep.forEach((P, i) => {
        const spawn = SPAWNS[i % SPAWNS.length];
        P.tx = spawn.x;
        P.ty = spawn.y;
        P.p = 0;
        P.dir = 'left';
        P.wantDir = 'left';
        P.dead = false;
        P.out = false;
        P.invuln = game.race ? 1 : 0;   // spawn protection is a race courtesy
        P.respawnT = 0;
        P.rx = null;
        P.ry = null;
        P.anim = 0;
      });
      game.players = keep;
    } else {
      game.players = [makePlayer(0, { id: 'local', name: game.netName || 'You', isLocal: true })];
      game.localIndex = 0;
    }
    game.ghosts = HUNTERS.map(makeHunter);
    game.bonus = null;
    game.particles.length = 0;
    game.floats.length = 0;
    endFright();
  }

  function newLevel(keepPlayers) {
    dots.set(baseDots);
    game.dotsLeft = totalDots;
    game.dotsEaten = 0;
    game.bonusGiven = 0;
    game.mode = 'scatter';
    game.modeIndex = 0;
    game.modeTimer = Math.max(3, MODE_PLAN[0][1] * (1 - (game.level - 1) * 0.09));
    game.roundWhy = null;
    resetActors(keepPlayers);
    buildMazeLayer();
    game.state = 'ready';
    game.stateTimer = 2.1;
    game.flash = 0.25;
    paintHud();
  }

  /** Solo game (and the tests): one disc, three lives, score from zero. */
  function startGame() {
    game.mode2 = 'solo';
    game.race = false;
    game.roomCode = null;
    game.players = [];
    game.localIndex = 0;
    resetActors(false);
    game.score = 0;
    game.level = 1;
    game.lives = 3;
    local().extraLife = false;
    game.combo = 0;
    game.high = Math.max(game.high, 0);
    hideOverlay();
    newLevel(false);
  }

  /** Multiplayer round: every connected disc, fresh scores. */
  function startRace(level) {
    game.race = game.players.length > 1;
    game.level = level || 1;
    game.combo = 0;
    for (const P of game.players) {
      P.score = 0;
      P.lives = 3;
      P.extraLife = false;
      P.out = false;
      P.dead = false;
    }
    game.localIndex = Math.max(0, game.players.findIndex((P) => P.isLocal));
    hideOverlay();
    newLevel(true);
    if (game.mode2 === 'host') {
      netSend({ t: 'start', level: game.level, players: playerRoster() });
      netSend(snapshot());
    }
  }

  function togglePause() {
    if (online()) {
      // Nobody can pause a live race: this is a local menu instead.
      if (overlay.classList.contains('show')) hideOverlay();
      else showScreen('menu');
      return;
    }
    if (game.state === 'playing' || game.state === 'ready') {
      game.prevState = game.state;
      game.state = 'paused';
      showScreen('paused');
    } else if (game.state === 'paused') {
      game.state = game.prevState;
      hideOverlay();
    }
  }

  function primaryAction() {
    if (game.state === 'title' || game.state === 'gameover') startGame();
    else if (game.state === 'paused') togglePause();
  }

  /* ==================================================================
     12b. NETWORK PLAY
     ------------------------------------------------------------------
     The host's browser owns the truth: it simulates the maze, the
     hunters and every disc, and streams snapshots ~12 times a second.
     Guests send their input and smooth the host's positions, predicting
     their own disc so the controls feel local.

     The server only relays messages between the players in a room; see
     src/net.js for the wire protocol and server.js for the relay.
     ================================================================== */
  const HSTATE = ['pen', 'leaving', 'roam', 'dead', 'entering'];
  const round10 = (n) => Math.round(n * 10) / 10;
  const round20 = (n) => Math.round(n * 20) / 20;

  const netAvailable = () => !!(typeof window !== 'undefined' && window.NeonNet);
  const online = () => game.mode2 === 'host' || game.mode2 === 'guest';
  const isHost = () => game.mode2 === 'host';
  const isGuest = () => game.mode2 === 'guest';

  /* ---------------- sending ---------------- */
  function netSend(data) {
    if (!game.net) return;
    game.net.send(Object.assign({ t: 'relay' }, { data }));
  }

  /* ---------------- the dot grid as a bitmask ---------------- */
  function dotMask() {
    const bytes = new Uint8Array(Math.ceil((COLS * ROWS) / 8));
    for (let i = 0; i < COLS * ROWS; i++) {
      if (dots[i]) bytes[i >> 3] |= 1 << (i & 7);
    }
    let out = '';
    for (let i = 0; i < bytes.length; i++) out += String.fromCharCode(bytes[i]);
    return btoa(out);
  }

  function applyDotMask(b64) {
    let raw;
    try { raw = atob(b64); } catch (err) { return; }
    let left = 0;
    for (let i = 0; i < COLS * ROWS; i++) {
      const on = (raw.charCodeAt(i >> 3) >> (i & 7)) & 1;
      dots[i] = on ? (baseDots[i] || DOT) : NO_DOT;
      if (on) left++;
    }
    game.dotsLeft = left;
  }

  function playerRoster() {
    return game.players.map((P, i) => ({
      id: P.id,
      name: P.name,
      color: P.color || PLAYER_COLORS[i % PLAYER_COLORS.length],
      index: i,
    }));
  }

  /* ---------------- host: build a snapshot ---------------- */
  function snapshot() {
    return {
      t: 's',
      f: game.frame,
      st: game.state,
      stt: round20(game.stateTimer),
      lv: game.level,
      ft: round20(game.frightTimer),
      mo: game.mode,
      rs: game.race ? 1 : 0,
      p: game.players.map((P) => {
        const pos = moverPos(P);
        return [
          P.id, round10(pos.x), round10(pos.y), DIR_LIST.indexOf(P.dir) < 0 ? 0 : DIR_LIST.indexOf(P.dir),
          Math.round(P.anim * 20) % 1000, P.score, P.lives,
          (P.out ? 4 : 0) | (P.dead ? 2 : 0) | (P.invuln > 0 ? 1 : 0),
          P.name,
        ];
      }),
      g: game.ghosts.map((h) => {
        const pos = moverPos(h);
        return [round10(pos.x), round10(pos.y), Math.max(0, DIR_LIST.indexOf(h.dir)), Math.max(0, HSTATE.indexOf(h.state)), h.frightened ? 1 : 0];
      }),
      d: dotMask(),
      b: game.bonus ? [game.bonus.x, game.bonus.y] : 0,
    };
  }

  function broadcastSnapshot(force) {
    if (!isHost() || !game.net) return;
    const now = game.time;
    if (!force && now - game.lastSnapAt < 1 / 12) return;
    game.lastSnapAt = now;
    netSend(snapshot());
  }

  /* ---------------- guest: apply a snapshot ---------------- */
  function applySnapshot(S) {
    if (!S || !S.p) return;
    game.frame = S.f || game.frame;

    // the host drives the state machine (never override a local pause)
    if (S.st && S.st !== game.state && game.state !== 'paused') {
      const prev = game.state;
      game.state = S.st;
      if (S.st === 'playing' && prev !== 'playing') hideOverlay();
      if (S.st === 'levelclear' || S.st === 'gameover') showScreen('standings');
    }
    if (typeof S.stt === 'number') game.stateTimer = S.stt;
    if (S.lv) game.level = S.lv;
    game.mode = S.mo || game.mode;
    const hadFright = game.frightTimer > 0;
    game.frightTimer = typeof S.ft === 'number' ? S.ft : 0;
    if (!hadFright && game.frightTimer > 0) {
      // a power orb went off somewhere: flash for everyone
      game.flash = 0.3;
      Sound.power();
    }
    game.race = !!S.rs;

    // discs
    const seen = [];
    for (const row of S.p) {
      const [id, x, y, dirIdx, anim, score, lives, flags, name] = row;
      seen.push(id);
      let P = playerById(id);
      if (!P) {
        P = makePlayer(game.players.length, { id, name: name || 'Disc', isLocal: id === game.net.selfId });
        P.score = score;
        P.lives = lives;
        game.players.push(P);
        game.localIndex = Math.max(0, game.players.findIndex((q) => q.isLocal));
      }
      P.name = name || P.name;
      P.score = score;
      P.lives = lives;
      if (P.isLocal && score > game.high) { game.high = score; saveHigh(); }
      P.out = !!(flags & 4);
      P.dead = !!(flags & 2);
      P.invuln = (flags & 1) ? 0.5 : 0;
      const dir = DIR_LIST[dirIdx] || P.dir;
      P.netDir = dir;
      if (P.isLocal) {
        // I simulate my own disc; only correct it when we have drifted apart
        const mine = moverPos(P);
        const dist = Math.hypot(mine.x - x, mine.y - y);
        if (dist > TILE * 1.2 || P.dead || P.out) {
          snapTo(P, x, y, dir);
        }
      } else {
        P.tgtX = x;
        P.tgtY = y;
        if (P.rx == null) { P.rx = x; P.ry = y; }
        P.dir = dir;
        P.anim += anim * 0.0001;
      }
    }
    // drop discs the host no longer knows about
    if (seen.length) game.players = game.players.filter((P) => seen.includes(P.id));

    // hunters
    S.g.forEach((row, i) => {
      const h = game.ghosts[i];
      if (!h) return;
      const [x, y, dirIdx, stateIdx, frightened] = row;
      h.tgtX = x;
      h.tgtY = y;
      if (h.rx == null) { h.rx = x; h.ry = y; }
      h.dir = DIR_LIST[dirIdx] || h.dir;
      h.state = HSTATE[stateIdx] || h.state;
      h.frightened = !!frightened;
    });

    applyDotMask(S.d);
    game.bonus = S.b && S.b.length ? { x: S.b[0], y: S.b[1], life: 6, value: 100, spin: game.time * 2 } : null;
    paintHud();
  }

  /**
   * Hard-place a guest's disc (spawn, death, or a big correction).
   * moverPos() is (tile + 0.5 + dir * p) * TILE, so invert that exactly:
   * for a rightward mover p is how far past the centre we are, and so on.
   */
  function snapTo(P, x, y, dir) {
    const d = DIRS[dir] ? dir : P.dir;
    const fx = x / TILE;
    const fy = y / TILE;
    const tx = Math.floor(fx);
    const ty = Math.floor(fy);
    P.tx = wrapX(tx);
    P.ty = Math.max(0, Math.min(ROWS - 1, ty));
    let prog;
    if (d === 'right') prog = fx - tx - 0.5;
    else if (d === 'left') prog = tx + 0.5 - fx;
    else if (d === 'down') prog = fy - ty - 0.5;
    else prog = ty + 0.5 - fy;
    P.p = Math.max(0, Math.min(1, prog));
    P.dir = d;
    P.rx = null;
    P.ry = null;
    P.moving = true;
  }

  /* ---------------- guest: smooth everyone else ---------------- */
  function updateNetSmoothing(dt) {
    const k = Math.min(1, dt * 14);
    for (const P of game.players) {
      if (P.rx == null || P.tgtX == null) continue;
      P.rx += (P.tgtX - P.rx) * k;
      P.ry += (P.tgtY - P.ry) * k;
      P.moving = true;
      P.anim += dt;
    }
    for (const h of game.ghosts) {
      if (h.rx != null && h.tgtX != null) {
        h.rx += (h.tgtX - h.rx) * k;
        h.ry += (h.tgtY - h.ry) * k;
      }
      h.anim += dt;
      if (h.state === 'pen') h.bounce += dt * 5.5;
    }
  }

  /* ---------------- guest: effects from the host ---------------- */
  function applyFx(m) {
    switch (m.kind) {
      case 'eatHunter':
        floatText(m.x, m.y, String(m.v), '#8ef0ff', 21);
        burst(m.x, m.y, '#9fe9ff', 24);
        Sound.eatHunter(1);
        break;
      case 'caught':
        burst(m.x, m.y, '#ffdf7a', 26);
        game.shake = 0.5;
        if (m.id !== game.net.selfId) Sound.pen();
        break;
      case 'bonus':
        floatText(m.x, m.y, '+' + m.v, '#ffe14d', 20);
        burst(m.x, m.y, '#ffe14d', 20);
        break;
      case 'clear':
        Sound.levelUp();
        break;
      default:
        break;
    }
  }

  /* ---------------- session plumbing ---------------- */
  function netStatusText() {
    switch (game.netStatus) {
      case 'connecting': return 'connecting…';
      case 'lobby': return 'in lobby';
      case 'live': return 'live';
      case 'lost': return 'disconnected';
