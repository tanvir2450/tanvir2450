<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>One Piece Fight</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0f;
            color: #e8e8e8;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Screen Overlays */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 50%, #16213e 100%);
            z-index: 10;
        }
        .screen.active {
            display: flex;
        }
        .screen-title {
            font-size: clamp(2rem, 8vw, 4rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700, #ff8c00, #ff4500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
            text-align: center;
        }
        .screen-subtitle {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: #ffd700;
            margin-bottom: 2rem;
            text-align: center;
        }
        .btn {
            padding: 1rem 2.5rem;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            min-width: 200px;
            margin: 0.5rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6b00, #ff3d00);
            color: white;
            box-shadow: 0 4px 20px rgba(255, 107, 0, 0.4);
        }
        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 2px 10px rgba(255, 107, 0, 0.4);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
            color: #ffd700;
            border: 2px solid #ffd700;
        }
        .btn-secondary:active {
            transform: scale(0.96);
            background: linear-gradient(135deg, #3a3a5a, #2a2a4a);
        }
        .btn-danger {
            background: linear-gradient(135deg, #c0392b, #8b0000);
            color: white;
        }
        /* Character Select */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            padding: 1rem;
            max-width: 900px;
            width: 100%;
        }
        .char-card {
            background: linear-gradient(145deg, #1a1a3a, #0d0d1a);
            border: 2px solid #2a2a4a;
            border-radius: 16px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .char-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--char-color, #ffd700);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .char-card.selected::before {
            opacity: 1;
        }
        .char-card.selected {
            border-color: var(--char-color, #ffd700);
            box-shadow: 0 0 20px var(--char-color, #ffd700), inset 0 0 20px rgba(255, 215, 0, 0.1);
        }
        .char-card:active {
            transform: scale(0.98);
        }
        .char-portrait {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin-bottom: 0.75rem;
            position: relative;
            overflow: hidden;
        }
        .char-name {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            color: #fff;
        }
        .char-style {
            font-size: 0.75rem;
            text-align: center;
            color: #ffd700;
            margin-top: 0.25rem;
        }
        .char-level {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: var(--char-color, #ffd700);
            color: #000;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        /* Arc/Level Select */
        .arc-list {
            width: 100%;
            max-width: 600px;
            padding: 1rem;
        }
        .arc-card {
            background: linear-gradient(145deg, #1a1a3a, #0d0d1a);
            border: 2px solid #2a2a4a;
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .arc-card:active {
            transform: scale(0.98);
        }
        .arc-card.unlocked {
            border-color: #ffd700;
        }
        .arc-card.locked {
            opacity: 0.5;
            border-color: #444;
        }
        .arc-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .arc-name {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffd700;
        }
        .arc-progress {
            font-size: 0.9rem;
            color: #888;
        }
        .arc-bosses {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .boss-badge {
            padding: 0.3rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
            border: 1px solid #444;
        }
        .boss-badge.defeated {
            background: linear-gradient(135deg, #27ae60, #1e8a49);
            border-color: #27ae60;
            color: #fff;
        }
        .boss-badge.current {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-color: #e74c3c;
            color: #fff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(231, 76, 60, 0); }
        }
        /* Shop/Upgrade */
        .shop-container {
            width: 100%;
            max-width: 800px;
            padding: 1rem;
            overflow-y: auto;
            max-height: 80vh;
        }
        .currency-display {
            display: flex;
            justify-content: space-around;
            background: linear-gradient(135deg, #1a1a3a, #0d0d1a);
            border: 2px solid #ffd700;
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .currency-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .currency-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffd700;
        }
        .currency-label {
            font-size: 0.75rem;
            color: #888;
        }
        .shop-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
        }
        .shop-tab {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(145deg, #1a1a3a, #0d0d1a);
            border: 2px solid #2a2a4a;
            border-radius: 25px;
            color: #888;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .shop-tab.active {
            border-color: #ffd700;
            color: #ffd700;
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
        }
        .shop-tab:active {
            transform: scale(0.96);
        }
        .upgrade-list, .consumable-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .upgrade-item {
            background: linear-gradient(145deg, #1a1a3a, #0d0d1a);
            border: 2px solid #2a2a4a;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .upgrade-info {
            flex: 1;
            min-width: 200px;
        }
        .upgrade-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }
        .upgrade-desc {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.25rem;
        }
        .upgrade-stats {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }
        .stat {
            font-size: 0.75rem;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            padding: 0.2rem 0.5rem;
            border-radius: 8px;
        }
        .upgrade-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .upgrade-level {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffd700;
            min-width: 60px;
            text-align: center;
        }
        .btn-upgrade {
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, #27ae60, #1e8a49);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-upgrade:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
        .btn-upgrade:active:not(:disabled) {
            transform: scale(0.95);
        }
        .consumable-item {
            background: linear-gradient(145deg, #1a1a3a, #0d0d1a);
            border: 2px solid #2a2a4a;
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .consumable-info {
            flex: 1;
            min-width: 200px;
        }
        .consumable-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }
        .consumable-desc {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.25rem;
        }
        .consumable-price {
            font-size: 1rem;
            font-weight: 700;
            color: #ffd700;
        }
        .btn-buy {
            padding: 0.5rem 1.5rem;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-buy:active {
            transform: scale(0.95);
        }
        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            padding: 1rem;
            pointer-events: auto;
        }
        .hud-stats {
            display: flex;
            gap: 1rem;
        }
        .stat-bar-container {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
            padding: 0.5rem;
            border: 2px solid #333;
            min-width: 180px;
        }
        .stat-label {
            font-size: 0.7rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-bar {
            height: 8px;
            background: #1a1a1a;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.25rem;
        }
        .stat-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .stat-bar-fill.hp { background: linear-gradient(90deg, #e74c3c, #c0392b); }
        .stat-bar-fill.mp { background: linear-gradient(90deg, #3498db, #2980b9); }
        .stat-bar-fill.xp { background: linear-gradient(90deg, #ffd700, #ff8c00); }
        .stat-text {
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.25rem;
            text-align: right;
        }
        .hud-level {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ffd700;
            border-radius: 12px;
            padding: 0.5rem 1rem;
            font-weight: 700;
            color: #ffd700;
            min-width: 80px;
            text-align: center;
        }
        .hud-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            pointer-events: auto;
        }
        /* Virtual Joystick */
        .joystick-container {
            position: relative;
            width: 140px;
            height: 140px;
            touch-action: none;
        }
        .joystick-base {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 215, 0, 0.1), rgba(0, 0, 0, 0.5));
        }
        .joystick-stick {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5), inset 0 -3px 6px rgba(0, 0, 0, 0.3);
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
            transition: transform 0.05s ease-out;
            pointer-events: none;
        }
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            align-items: flex-end;
        }
        .action-row {
            display: flex;
            gap: 0.75rem;
        }
        .action-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid rgba(255, 215, 0, 0.4);
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.7));
            color: #ffd700;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            transition: all 0.1s;
            position: relative;
        }
        .action-btn:active, .action-btn.pressed {
            transform: scale(0.9);
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2), rgba(255, 215, 0, 0.3));
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5), inset 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .action-btn.special {
            width: 80px;
            height: 80px;
            font-size: 1.8rem;
            border-color: rgba(231, 76, 60, 0.4);
            background: radial-gradient(circle at 30% 30%, rgba(231, 76, 60, 0.2), rgba(0, 0, 0, 0.7));
            color: #e74c3c;
        }
        .action-btn.special:active, .action-btn.special.pressed {
            border-color: #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.6), inset 0 0 20px rgba(231, 76, 60, 0.3);
        }
        .action-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .cooldown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }
        /* Combat Log */
        #combat-log {
            position: absolute;
            top: 80px;
            left: 1rem;
            right: 1rem;
            max-height: 150px;
            overflow-y: auto;
            pointer-events: none;
            z-index: 5;
        }
        .log-entry {
            background: rgba(0, 0, 0, 0.8);
            border-left: 3px solid #ffd700;
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.25rem;
            border-radius: 0 8px 8px 0;
            font-size: 0.8rem;
            animation: slideIn 0.3s ease;
        }
        .log-entry.damage { border-left-color: #e74c3c; }
        .log-entry.heal { border-left-color: #27ae60; }
        .log-entry.special { border-left-color: #9b59b6; }
        .log-entry.coin { border-left-color: #ffd700; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        /* Pause Menu */
        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            z-index: 20;
        }
        .pause-overlay.active { display: flex; }
        .pause-title { font-size: 2.5rem; font-weight: 900; color: #ffd700; }
        .pause-menu { display: flex; flex-direction: column; gap: 1rem; }
        /* Result Screen */
        .result-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            z-index: 20;
        }
        .result-overlay.active { display: flex; }
        .result-title { font-size: 3rem; font-weight: 900; }
        .result-title.victory { color: #27ae60; text-shadow: 0 0 30px rgba(39, 174, 96, 0.5); }
        .result-title.defeat { color: #e74c3c; text-shadow: 0 0 30px rgba(231, 76, 60, 0.5); }
        .result-rewards { display: flex; gap: 2rem; margin: 1rem 0; }
        .reward-item { display: flex; flex-direction: column; align-items: center; }
        .reward-value { font-size: 2rem; font-weight: 800; color: #ffd700; }
        .reward-label { font-size: 0.9rem; color: #888; }
        /* Loading */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loading-screen.hidden { opacity: 0; visibility: hidden; }
        .loading-bar {
            width: 200px;
            height: 6px;
            background: #1a1a3a;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 1rem;
        }
        .loading-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }
        /* Transformation Indicator */
        .transformation-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 20px #ffd700, 0 0 40px #ff8c00;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            animation: transformPop 1.5s ease forwards;
        }
        @keyframes transformPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
        /* Damage Numbers */
        .damage-number {
            position: absolute;
            font-weight: 800;
            font-size: 1.5rem;
            pointer-events: none;
            z-index: 15;
            animation: damageFloat 1s ease-out forwards;
        }
        .damage-number.player { color: #ffd700; text-shadow: 0 0 10px #ffd700; }
        .damage-number.enemy { color: #e74c3c; text-shadow: 0 0 10px #e74c3c; }
        .damage-number.crit { font-size: 2rem; color: #ff6b00; text-shadow: 0 0 15px #ff6b00; }
        .damage-number.heal { color: #27ae60; text-shadow: 0 0 10px #27ae60; }
        @keyframes damageFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }
        /* Responsive */
        @media (max-width: 480px) {
            .joystick-container { width: 120px; height: 120px; }
            .joystick-stick { width: 40px; height: 40px; }
            .action-btn { width: 60px; height: 60px; font-size: 1.2rem; }
            .action-btn.special { width: 70px; height: 70px; font-size: 1.5rem; }
            .stat-bar-container { min-width: 140px; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .screen-title { font-size: 1.5rem; margin-bottom: 0.5rem; }
            .screen-subtitle { font-size: 0.9rem; margin-bottom: 1rem; }
            .btn { padding: 0.75rem 1.5rem; font-size: 0.9rem; min-width: 150px; }
            .char-grid { grid-template-columns: repeat(3, 1fr); }
            .char-portrait { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="screen-title">ONE PIECE FIGHT</div>
        <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
        <div id="loading-text" style="margin-top: 1rem; color: #888;">Initializing...</div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="hud"></div>
        <div id="combat-log"></div>
        
        <!-- Main Menu -->
        <div id="main-menu" class="screen active">
            <div class="screen-title">ONE PIECE FIGHT</div>
            <div class="screen-subtitle">2D Side-Scrolling Fighting Game</div>
            <button class="btn btn-primary" onclick="showScreen('character-select')">START GAME</button>
            <button class="btn btn-secondary" onclick="showScreen('shop-screen')">SHOP & UPGRADES</button>
            <button class="btn btn-secondary" onclick="showScreen('codex-screen')">CODEX</button>
        </div>

        <!-- Character Select -->
        <div id="character-select" class="screen">
            <div class="screen-title">CHOOSE YOUR FIGHTER</div>
            <div class="screen-subtitle">Tap a character to select</div>
            <div class="char-grid" id="char-grid"></div>
            <button class="btn btn-primary" id="start-battle-btn" disabled onclick="startSelectedLevel()">ENTER BATTLE</button>
            <button class="btn btn-secondary" onclick="showScreen('main-menu')">BACK</button>
        </div>

        <!-- Level Select -->
        <div id="level-select" class="screen">
            <div class="screen-title" id="level-select-title">SELECT ARC</div>
            <div class="arc-list" id="arc-list"></div>
            <button class="btn btn-secondary" onclick="showScreen('character-select')">BACK</button>
        </div>

        <!-- Shop Screen -->
        <div id="shop-screen" class="screen">
            <div class="screen-title">SHOP & UPGRADES</div>
            <div class="currency-display">
                <div class="currency-item">
                    <span class="currency-value" id="shop-coins">0</span>
                    <span class="currency-label">COINS</span>
                </div>
                <div class="currency-item">
                    <span class="currency-value" id="shop-health-potions">0</span>
                    <span class="currency-label">HP POTIONS</span>
                </div>
                <div class="currency-item">
                    <span class="currency-value" id="shop-mana-potions">0</span>
                    <span class="currency-label">MP POTIONS</span>
                </div>
            </div>
            <div class="shop-tabs">
                <button class="shop-tab active" data-tab="upgrades" onclick="switchShopTab('upgrades')">UPGRADES</button>
                <button class="shop-tab" data-tab="consumables" onclick="switchShopTab('consumables')">CONSUMABLES</button>
            </div>
            <div class="upgrade-list" id="upgrade-list"></div>
            <div class="consumable-list" id="consumable-list" style="display: none;"></div>
            <button class="btn btn-secondary" onclick="showScreen('main-menu')">BACK</button>
        </div>

        <!-- Codex Screen -->
        <div id="codex-screen" class="screen">
            <div class="screen-title">CODEX</div>
            <div class="screen-subtitle">Enemies & Bosses Encountered</div>
            <div style="width: 90%; max-width: 600px; max-height: 60vh; overflow-y: auto;" id="codex-list"></div>
            <button class="btn btn-secondary" onclick="showScreen('main-menu')">BACK</button>
        </div>

        <!-- Pause Overlay -->
        <div id="pause-overlay" class="pause-overlay">
            <div class="pause-title">PAUSED</div>
            <div class="pause-menu">
                <button class="btn btn-primary" onclick="togglePause()">RESUME</button>
                <button class="btn btn-secondary" onclick="restartLevel()">RESTART</button>
                <button class="btn btn-secondary" onclick="exitToMenu()">MAIN MENU</button>
            </div>
        </div>

        <!-- Result Overlay -->
        <div id="result-overlay" class="result-overlay">
            <div class="result-title" id="result-title">VICTORY</div>
            <div class="result-rewards">
                <div class="reward-item">
                    <div class="reward-value" id="reward-coins">+0</div>
                    <div class="reward-label">COINS</div>
                </div>
                <div class="reward-item">
                    <div class="reward-value" id="reward-xp">+0</div>
                    <div class="reward-label">XP</div>
                </div>
            </div>
            <button class="btn btn-primary" onclick="closeResult()">CONTINUE</button>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/art.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/fighter.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
