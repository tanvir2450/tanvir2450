function drawMapLevelGrid() {
  const cols = 10, rows = 3;
  const cw = 86, ch = 80, gapX = 8, gapY = 10;
  const startX = (W - (cols * cw + (cols - 1) * gapX)) / 2;
  const startY = 82;
  const arcNames = ['I', 'II', 'III', 'IV', 'V'];

  for (let s = 0; s < LEVELS_PER_ARC; s++) {
    const lvl = mapArcIdx * LEVELS_PER_ARC + s;
    const r = Math.floor(s / cols), c = s % cols;
    const x = startX + c * (cw + gapX);
    const y = startY + r * (ch + gapY);

    const cleared = isLevelCleared(lvl);
    const unlocked = isLevelUnlocked(lvl);
    const kind = levelBadge(lvl);
    const isBoss = kind !== 'grunt';
    const isNext = unlocked && lvl === progressLevel && !cleared;

    let fill = 'rgba(22, 24, 40, 0.95)';
    if (cleared) fill = 'rgba(0, 90, 50, 0.75)';
    if (isBoss && !cleared) fill = 'rgba(80, 12, 22, 0.85)';
    if (!unlocked) fill = 'rgba(12, 12, 18, 0.9)';

    ctx.fillStyle = fill;
    ctx.fillRect(x, y, cw, ch);

    let border = 'rgba(255,255,255,0.22)';
    if (cleared) border = '#00e676';
    else if (isBoss) border = '#ffeb3b';
    if (isNext) {
      const pulse = 0.6 + 0.4 * Math.sin(frameCounter * 0.12);
      border = '#ffeb3b';
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#ffeb3b';
      ctx.lineWidth = 4;
      ctx.strokeRect(x - 3, y - 3, cw + 6, ch + 6);
      ctx.restore();
    }
    ctx.strokeStyle = border;
    ctx.lineWidth = isBoss ? 2.5 : 1.5;
    ctx.strokeRect(x, y, cw, ch);

    ctx.textAlign = 'center';
    ctx.fillStyle = unlocked ? '#fff' : '#666';
    ctx.font = 'bold 19px Arial';
    ctx.fillText(String(s + 1), x + cw / 2, y + 30);

    if (!unlocked) {
      ctx.font = '20px Arial';
      ctx.fillText('\u{1F512}', x + cw / 2, y + 58);
    } else if (cleared) {
      ctx.font = 'bold 13px Arial';
      ctx.fillStyle = '#69f0ae';
      ctx.fillText('\u2705 CLEAR', x + cw / 2, y + 56);
    } else if (isBoss) {
      ctx.font = '17px Arial';
      ctx.fillStyle = '#ffeb3b';
      ctx.fillText('\u{1F451}', x + cw / 2, y + 55);
      ctx.font = 'bold 9px Arial';
      ctx.fillStyle = '#ff8a80';
      ctx.fillText(kind === 'arcboss' ? 'ARC BOSS' : kind === 'elite' ? 'ELITE' : 'MINI', x + cw / 2, y + 70);
    } else if (isNext) {
      ctx.font = 'bold 13px Arial';
      ctx.fillStyle = '#ffeb3b';
      ctx.fillText('\u25B6 FIGHT', x + cw / 2, y + 56);
    } else {
      ctx.font = 'bold 11px Arial';
      ctx.fillStyle = '#ffab40';
      ctx.fillText('REPLAY', x + cw / 2, y + 56);
    }

    uiButtons.push({
      x, y, w: cw, h: ch,
      onClick: () => {
        if (!isLevelUnlocked(lvl)) {
          sfx.play('block', 0.7);
          showToast(`\u{1F512} LEVEL ${s + 1} LOCKED \u2014 Clear the previous level first!`, 170);
          return;
        }
        sfx.play('select', 0.6);
        startMatch(lvl);
      }
    });
  }
}

function drawMapBackButton() {
  const bx = 24, by = H - 62, bw = 150, bh = 42;
  ctx.fillStyle = '#1b1026';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = '#ffeb3b';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('\u25C0 ARC LIST', bx + bw / 2, by + 27);

  uiButtons.push({
    x: bx, y: by, w: bw, h: bh,
    onClick: () => { sfx.play('select', 0.6); mapSubView = 'arcs'; }
  });
}

function drawOverlayBanner(msg, sub = '', sub2 = '') {
  uiButtons.length = 0;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.78)';
  ctx.fillRect(0, H / 2 - 90, W, 185);
  ctx.strokeStyle = '#e94560';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, H / 2 - 90);
  ctx.lineTo(W, H / 2 - 90);
  ctx.moveTo(0, H / 2 + 95);
  ctx.lineTo(W, H / 2 + 95);
  ctx.stroke();

  ctx.fillStyle = '#ffeb3b';
  ctx.font = 'bold 46px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(msg, W / 2, H / 2 - 20);

  if (sub) {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 17px Arial';
    ctx.fillText(sub, W / 2, H / 2 + 15);
  }

  if (matchState === 'roundEnd' || matchState === 'matchEnd') {
    const bx = W / 2 - 125, by = H / 2 + 34, bw = 250, bh = 42;
    ctx.fillStyle = '#e94560';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#ffeb3b';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Arial';
    ctx.fillText(sub2 || 'CONTINUE (TAP / ENTER)', W / 2, by + 27);

    uiButtons.push({
      x: bx, y: by, w: bw, h: bh,
      onClick: () => handleGlobalHotkeys('enter')
    });
  }
}

// ============================================================================
// 10. MAIN GAME LOOP
// ============================================================================
let frameCounter = 0;

// One level at a time: winning the frontier level unlocks the next one and,
// at every 30th clear, the following Arc (plus Armory / Map milestones).
function grantLevelClear() {
  if (GAME_MODES[currentModeIdx] !== 'Campaign') return;
  if (currentLevel !== progressLevel) return;
  if (progressLevel >= TOTAL_LEVELS) return;

  const arcNames = ['I', 'II', 'III', 'IV', 'V'];
  const beforeArc = arcOfLevel(progressLevel);
  const before = progressLevel;
  progressLevel++;
  saveProgress();

  if (before < ARMORY_UNLOCK_AT && progressLevel >= ARMORY_UNLOCK_AT) {
    showToast('⛩️ UNLOCKED: DOJO ARMORY — Forge weapons & equip Enchantments!', 240);
  }
  if (before < MAP_UNLOCK_AT && progressLevel >= MAP_UNLOCK_AT) {
    showToast('🗺️ UNLOCKED: WORLD MAP — Travel between Acts & replay levels!', 240);
  }
  const afterArc = maxUnlockedArc();
  if (afterArc > beforeArc && afterArc < ARC_COUNT) {
    showToast(`🔥 UNLOCKED: ARC ${arcNames[afterArc]} — ${STAGES[afterArc].name}! 30 new levels!`, 260);
  }
  if (progressLevel >= TOTAL_LEVELS) {
    showToast('👑 ALL 150 LEVELS CLEARED — YOU ARE THE SHADOW CHAMPION!', 320);
  }
}

function onRoundFinished(roundWinner) {
  const mode = GAME_MODES[currentModeIdx];

  if (mode === 'Survival') {
    if (roundWinner === 'player') {
      addRewards(50, 45);
      survivalWave++;
      matchState = 'roundEnd';
      winner = 'player';
    } else {
      matchState = 'matchEnd';
      winner = 'enemy';
    }
    return;
  }

  if (roundWinner === 'player') {
    p1RoundsWon++;
    addRewards(35, 30);
  } else {
    p2RoundsWon++;
  }

  if (p1RoundsWon >= 2 || p2RoundsWon >= 2) {
    matchState = 'matchEnd';
    winner = p1RoundsWon >= 2 ? 'player' : 'enemy';
    if (winner === 'player') {
      addRewards(75, 65);
      grantLevelClear();
    }
  } else {
    matchState = 'roundEnd';
    winner = roundWinner;
  }
}

function loop() {
  requestAnimationFrame(loop);
  frameCounter++;
  updateToast();

  if (slowMoFrames > 0) {
    slowMoFrames--;
    if (frameCounter % 3 !== 0) return;
  }

  if (screenView === 'armory') {
    drawArmoryScreen();
    for (const k in justPressed) delete justPressed[k];
    return;
  }
  if (screenView === 'map') {
    drawWorldMapScreen();
    for (const k in justPressed) delete justPressed[k];
    return;
  }

  uiButtons.length = 0;
  ctx.save();
  if (screenShake > 0) {
    const dx = (Math.random() - 0.5) * screenShake;
    const dy = (Math.random() - 0.5) * screenShake;
    ctx.translate(dx, dy);
    screenShake *= 0.82;
    if (screenShake < 0.5) screenShake = 0;
  }

  const stage = STAGES[currentStageIdx];
  drawStageBackground(stage);

  if (matchState === 'fight') {
    if (roundStart > 0) {
      roundStart--;
      drawFightHUD();
      player.draw();
      enemy.draw();
      const mode2 = GAME_MODES[currentModeIdx];
      let titleBanner = `ROUND ${currentRoundNum}`;
      let versusSub = `${player.name}  VS  ${enemy.name}`;
      if (mode2 === 'Survival') {
        titleBanner = `WAVE ${survivalWave}`;
      } else if (mode2 === 'Campaign') {
        titleBanner = `LEVEL ${stepOfLevel(currentLevel)} / ${LEVELS_PER_ARC}`;
        if (enemy.isBossFight) {
          titleBanner += '  👑 BOSS';
          versusSub = `${enemy.name} — ${enemy.title}`;
        }
      }
      drawOverlayBanner(
        roundStart > 38 ? titleBanner : 'FIGHT!',
        roundStart > 38 ? versusSub : ''
      );
      ctx.restore();
      for (const k in justPressed) delete justPressed[k];
      return;
    }

    timer--;
    player.handleInput(enemy);
    if (!enemy.isAI) enemy.handleInput(player);
    player.update(enemy);
    enemy.update(player);

    checkAttack(player, enemy);
    checkAttack(enemy, player);
    updateProjectilesAndDroppedWeapons();

    if (player.hp <= 0) onRoundFinished('enemy');
    else if (enemy.hp <= 0) onRoundFinished('player');
    else if (timer <= 0) onRoundFinished(player.hp >= enemy.hp ? 'player' : 'enemy');
  }

  for (let i = afterimages.length - 1; i >= 0; i--) {
    const ai = afterimages[i];
    ai.life--;
    ctx.save();
    ctx.globalAlpha = (ai.life / ai.maxLife) * 0.35;
    ctx.strokeStyle = ai.color;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(ai.x, ai.y - 95, 11, 0, Math.PI * 2);
    ctx.moveTo(ai.x, ai.y - 84);
    ctx.lineTo(ai.x, ai.y - 35);
    ctx.stroke();
    ctx.restore();
    if (ai.life <= 0) afterimages.splice(i, 1);
  }

  for (let i = lightningBolts.length - 1; i >= 0; i--) {
    const lb = lightningBolts[i];
    lb.life--;
    ctx.save();
    ctx.globalAlpha = lb.life / lb.maxLife;
    ctx.strokeStyle = '#fff';
    ctx.shadowColor = lb.color;
    ctx.shadowBlur = 20;
    ctx.lineWidth = 4;
    ctx.beginPath();
    lb.segments.forEach((seg, idx) => {
      if (idx === 0) ctx.moveTo(seg.x, seg.y);
      else ctx.lineTo(seg.x, seg.y);
    });
    ctx.stroke();
    ctx.restore();
    if (lb.life <= 0) lightningBolts.splice(i, 1);
  }

  for (const dw of droppedWeapons) {
    ctx.save();
    ctx.translate(dw.x, dw.y);
    ctx.rotate(dw.rot);
    ctx.strokeStyle = dw.weapon.glow;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-22, 0);
    ctx.lineTo(22, 0);
    ctx.stroke();
    ctx.restore();
  }

  for (const p of projectiles) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.strokeStyle = p.color;
    ctx.fillStyle = '#fff';
    ctx.lineWidth = 2;
    for (let b = 0; b < 4; b++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(11, -3);
      ctx.lineTo(14, 0);
      ctx.lineTo(11, 3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
    ctx.restore();
  }

  player.draw();
  enemy.draw();

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.28;
    pt.life--;
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    if (pt.life <= 0) particles.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.life--;
    ctx.save();
    ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
    ctx.font = `bold ${ft.size}px Arial`;
    ctx.fillStyle = ft.color;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.textAlign = 'center';
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }

  drawFightHUD();

  if (matchState === 'roundEnd') {
    const mode = GAME_MODES[currentModeIdx];
    const msg = mode === 'Survival'
      ? `WAVE ${survivalWave - 1} CLEARED! (+50 🪙)`
      : (winner === 'player' ? `ROUND ${currentRoundNum} WON! (+35 🪙)` : `ROUND ${currentRoundNum} LOST!`);
    drawOverlayBanner(msg, 'Prepare for the next clash', '▶ NEXT ROUND (TAP / ENTER)');
  } else if (matchState === 'matchEnd') {
    const isWin = winner === 'player';
    const mode2 = GAME_MODES[currentModeIdx];
    const nextLvl = currentLevel + 1;
    const hasNextLevel = isWin && mode2 === 'Campaign' && nextLvl < TOTAL_LEVELS;
    let mainMsg, subMsg, btnMsg;

    if (mode2 !== 'Campaign') {
      mainMsg = isWin ? 'VICTORY (+75 🪙)!' : 'DEFEATED!';
      subMsg = 'Upgrade in the Armory, then fight again!';
      btnMsg = '▶ REMATCH (TAP / ENTER)';
    } else if (isWin && !hasNextLevel) {
      mainMsg = '👑 SHADOW CHAMPION!';
      subMsg = 'All 150 levels cleared — the Gates of Shadows are yours!';
      btnMsg = '▶ REPLAY LEVEL 150 (TAP / ENTER)';
    } else if (isWin) {
      const crossedArc = arcOfLevel(currentLevel) !== arcOfLevel(nextLvl);
      mainMsg = crossedArc ? '🔥 ARC CLEARED! (+75 🪙)' : (enemy.isBossFight ? '👑 BOSS DEFEATED! (+75 🪙)' : 'VICTORY (+75 🪙)!');
      subMsg = `Level ${stepOfLevel(currentLevel)}/${LEVELS_PER_ARC} cleared  •  Next: ${STAGES[arcOfLevel(nextLvl)].arc} — Level ${stepOfLevel(nextLvl)}${levelBadge(nextLvl) !== 'grunt' ? ' 👑 BOSS' : ''}`;
      btnMsg = '▶ NEXT LEVEL (TAP / ENTER)';
    } else {
      mainMsg = 'DEFEATED!';
      subMsg = 'Upgrade in the Armory, then try this level again!';
      btnMsg = '▶ RETRY LEVEL (TAP / ENTER)';
    }
    drawOverlayBanner(mainMsg, subMsg, btnMsg);
  }

  drawToast();
  ctx.restore();
  for (const k in justPressed) delete justPressed[k];
}

loadProgress();
startMatch(Math.min(progressLevel, TOTAL_LEVELS - 1));
loop();
</script>
